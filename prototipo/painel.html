.mtop .brand i{height:38px}
.brand small{display:block;font-weight:500;font-size:.75rem;color:var(--soft);margin-top:-3px}
.navg{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);padding:12px 10px 4px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;color:var(--gray);font-weight:500;font-size:.92rem}
.nav a:hover{background:var(--bg);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--green-50);color:var(--green-dk);font-weight:600}
.nav a .b{margin-left:auto;font-size:.72rem;font-weight:700;border-radius:999px;padding:1px 7px;background:var(--line);color:var(--gray)}
.nav a .b.r{background:var(--rose);color:var(--rose-ink)}
.nav a .b.y{background:var(--sun);color:var(--sun-ink)}
.nav a .dot{margin-left:auto}
.me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 10px 4px;border-top:1px solid var(--line)}
.av{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,#9FD8B6,#2FA765);display:grid;place-items:center;color:#fff;font-weight:700;font-size:.8rem;flex:none}
.me div{font-size:.84rem;line-height:1.25}
.me span{color:var(--soft);font-size:.76rem}
.main{padding:26px 32px 80px;max-width:1180px;width:100%}
.mtop{display:none}
.tabbar{display:none}

/* ---------- elementos ---------- */
h1{font-size:1.55rem;font-weight:800;letter-spacing:-.01em;line-height:1.2}
h2{font-size:1.06rem;font-weight:700}
.sub{color:var(--gray);margin-top:2px}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.card{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.card+.card{margin-top:14px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.ch span,.muted{color:var(--soft);font-size:.84rem}
.grid2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;align-items:start}
.btn{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.85rem;border:1px solid var(--line);background:var(--white);white-space:nowrap;transition:all .15s}
.btn:hover{border-color:var(--green);color:var(--green-dk)}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}
.btn.p:hover{background:var(--green-dk);color:#fff}
.btn.d{color:var(--rose-ink)}
.btn.d:hover{border-color:var(--rose-ink)}
.btn.sm{padding:5px 11px;font-size:.8rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.field .seg{justify-self:start}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.76rem;font-weight:600;white-space:nowrap;background:var(--line);color:var(--gray)}
.chip.g{background:var(--green-50);color:var(--green-dk)}
.chip.y{background:var(--sun);color:var(--sun-ink)}
.chip.r{background:var(--rose);color:var(--rose-ink)}
.chip.b{background:var(--sky);color:var(--sky-ink)}
.chip.l{background:var(--lilac);color:var(--lilac-ink)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none;background:var(--green)}
.dot.y{background:#E2A400}.dot.r{background:var(--rose-ink)}.dot.n{background:var(--soft)}
.flag{width:21px;height:14px;border-radius:3px;flex:none;vertical-align:-2px}
.num{font-weight:700;font-size:.84rem;color:var(--gray);white-space:nowrap}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto;scrollbar-width:none}
.tabs button{padding:9px 10px;font-weight:600;font-size:.88rem;color:var(--gray);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:flex;align-items:center;gap:6px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.tabs .chip{font-size:.7rem;padding:0 7px}
.seg{display:inline-flex;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border-radius:999px;padding:5px 12px;font-size:.84rem;font-weight:600;color:var(--gray)}
.seg button[aria-pressed="true"]{background:var(--white);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.field{display:grid;gap:5px;margin-bottom:14px}
.field label{font-weight:600;font-size:.86rem}
.field .hint{font-size:.78rem;color:var(--soft)}
.in{width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--white);outline:0;font-size:.92rem}
.in:focus{border-color:var(--green)}
textarea.in{resize:vertical;min-height:70px;line-height:1.55}
.cnt{font-size:.74rem;color:var(--soft);text-align:right}
.cnt.over{color:var(--rose-ink);font-weight:700}
.empty{color:var(--soft);font-size:.9rem;padding:14px 0}
mark{background:#FFF0A8;color:inherit;border-radius:3px;padding:0 2px}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:12px;padding:11px 14px;font-size:.88rem;background:var(--bg);color:var(--gray)}
.note.r{background:var(--rose);color:var(--rose-ink)}
.note.y{background:var(--sun);color:var(--sun-ink)}
.note.g{background:var(--green-50);color:var(--green-dk)}
.note b{color:inherit}

/* ---------- hoje ---------- */
.status{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:7px 8px 7px 14px;font-size:.87rem}
.status b{font-weight:600}
.todo{display:grid}
.todo>div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.todo>div:first-child{border-top:0;padding-top:2px}
.ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:var(--bg);color:var(--gray)}
.ico.r{background:var(--rose);color:var(--rose-ink)}.ico.y{background:var(--sun);color:var(--sun-ink)}.ico.g{background:var(--green-50);color:var(--green-dk)}.ico.b{background:var(--sky);color:var(--sky-ink)}
.todo p{font-weight:600;font-size:.93rem;line-height:1.35}
.todo .m{font-size:.8rem;color:var(--gray);margin-top:3px;line-height:1.8}
.todo .m .chip{margin-left:4px}
.todo .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.vote{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px;padding:10px 0;border-top:1px solid var(--line);align-items:center}
.vote:first-child{border-top:0;padding-top:0}
.vote .d{background:var(--sun);color:var(--sun-ink);border-radius:10px;text-align:center;font-weight:800;font-size:.84rem;padding:5px 0;line-height:1.15}
.vote .d small{display:block;font-weight:600;font-size:.68rem}
.vote p{font-weight:600;font-size:.9rem;line-height:1.3}
.vote .m{font-size:.78rem;color:var(--gray);display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:3px}
.goal{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--line);gap:2px;margin:10px 0 8px}
.goal i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.78rem;color:var(--gray)}
.leg span{display:inline-flex;align-items:center;gap:5px}
.leg i{width:9px;height:9px;border-radius:3px;display:inline-block}
.mini{display:grid;gap:7px}
.mini div{display:flex;align-items:center;gap:8px;font-size:.86rem}
.mini div span:last-child{margin-left:auto;color:var(--soft);font-size:.78rem}
.since{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:16px}
.since div{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.since b{display:block;font-size:1.35rem;font-weight:800;line-height:1.1}
.since span{font-size:.8rem;color:var(--gray)}

/* ---------- listas ---------- */
.rows>div{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 0;border-top:1px solid var(--line)}
.rows>div:first-child{border-top:0;padding-top:0}
.rows p{font-weight:600;line-height:1.35}
.rows .m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--gray);margin-top:4px}
.rows .acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.score{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1rem;flex:none}
.score.sh{background:var(--green-50);color:var(--green-dk)}.score.sm{background:var(--sun);color:var(--sun-ink)}.score.sl{background:var(--bg);color:var(--soft)}
.tri{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 0;border-top:1px solid var(--line)}
.tri:first-child{border-top:0;padding-top:0}
.tri p{line-height:1.45}
.tri .m{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:.8rem;color:var(--gray);margin-top:6px}
.tri .acts{display:flex;flex-direction:column;gap:6px}
.disc{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.cap{display:flex;align-items:center;gap:10px;font-size:.86rem;color:var(--gray)}
.cap .bar{width:120px;height:8px;border-radius:999px;background:var(--line);overflow:hidden}
.cap .bar i{display:block;height:100%;background:var(--green)}
.prog{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;color:var(--gray)}
.prog .bar{width:60px;height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--green)}
table.t{width:100%;border-collapse:collapse;font-size:.88rem}
table.t th{text-align:left;font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--soft);padding:0 10px 8px 0;border-bottom:1px solid var(--line)}
table.t td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
.tw{overflow-x:auto}

/* ---------- editor ---------- */
.ed-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--gray);font-size:.86rem;font-weight:600}
.back:hover{color:var(--green-dk)}
.steps{display:flex;gap:4px;align-items:center;font-size:.78rem;font-weight:600;color:var(--soft);flex-wrap:wrap}
.steps span{display:inline-flex;align-items:center;gap:5px}
.steps span.on{color:var(--ink)}
.steps span.done{color:var(--green-dk)}
.steps i{width:8px;height:8px;border-radius:50%;background:currentColor;display:inline-block}
.steps em{width:14px;height:1px;background:var(--line);display:inline-block}
.ed{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
.dos{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.lawtext p{margin-bottom:10px;font-size:.9rem;line-height:1.6}
.lawtext b{font-weight:700}
.diff del{background:#FBDADA;color:#9B2C2C;text-decoration:line-through;border-radius:3px;padding:0 2px}
.diff ins{background:#D3EFDD;color:#1D6B43;text-decoration:none;border-radius:3px;padding:0 2px}
.tl{display:grid;gap:0}
.tl div{display:grid;grid-template-columns:62px minmax(0,1fr);gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:.88rem}
.tl div:first-child{border-top:0}
.tl b{font-weight:700;color:var(--gray);font-size:.8rem}
.blk{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;background:var(--white)}
.blk label{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:.86rem;margin-bottom:6px}
.blk textarea{width:100%;border:0;outline:0;resize:vertical;min-height:64px;line-height:1.6;font-size:.93rem;background:transparent}
.blk.done label::after{content:"✓";color:var(--green-dk);font-weight:800}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left}
.opt[aria-pressed="true"]{border-color:var(--ink);background:var(--bg)}
.opt b{font-size:.9rem}
.opt span{display:block;font-size:.8rem;color:var(--gray)}
.sw{width:12px;height:12px;border-radius:4px;margin-top:4px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.tg{border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:.82rem;font-weight:500;color:var(--gray);background:var(--white)}
.tg[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.gprev{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--white);margin-bottom:14px}
.gprev .u{font-size:.78rem;color:#4D5156}
.gprev .tt{color:#1A0DAB;font-size:1.08rem;line-height:1.3;margin:2px 0}
.gprev .ds{font-size:.84rem;color:#4D5156}
.chk{display:grid;gap:6px;font-size:.86rem}
.chk div{display:flex;gap:8px;align-items:flex-start}
.chk .ok{color:var(--green-dk)}.chk .no{color:var(--rose-ink)}.chk .wa{color:var(--sun-ink)}
.mat{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;border:1px dashed var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.mat.ok{border-style:solid}
.after{display:grid;gap:8px;counter-reset:a}
.after div{display:flex;gap:10px;font-size:.88rem;align-items:flex-start}
.after div::before{counter-increment:a;content:counter(a);width:20px;height:20px;border-radius:50%;background:var(--green-50);color:var(--green-dk);font-weight:700;font-size:.74rem;display:grid;place-items:center;flex:none;margin-top:1px}
.mtabs{display:none}
.subf{margin-top:10px;padding:10px 12px;border-radius:12px;background:var(--bg)}
.subf>span{display:block;font-size:.78rem;font-weight:700;color:var(--gray);margin-bottom:6px}
.subf .tg{background:var(--white)}
.subf .tg[aria-pressed="true"]{background:var(--ink)}
.comfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.combig{display:flex;align-items:center;gap:10px}
.combig b{font-size:1.6rem;font-weight:800;line-height:1}
.combig span{font-size:.84rem;color:var(--gray);line-height:1.25}
.combig small{color:var(--soft)}

/* ---------- modal e aviso ---------- */
.ov{position:fixed;inset:0;background:rgba(22,32,26,.38);display:grid;place-items:center;padding:16px;z-index:30}
.modal{background:var(--white);border-radius:18px;max-width:480px;width:100%;padding:22px;box-shadow:0 24px 60px -20px rgba(0,0,0,.35);max-height:calc(100vh - 32px);overflow:auto}
.modal h2{margin-bottom:4px}
.pubprev{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--bg);font-size:.88rem;margin:12px 0}
.pubprev b{display:block;margin-bottom:2px}
.mrow{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-radius:12px;padding:10px 16px;font-size:.88rem;opacity:0;pointer-events:none;transition:all .25s;z-index:40;max-width:min(520px,calc(100vw - 32px))}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.spin{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--green);border-radius:50%;animation:sp 0.8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--white);border-radius:18px 18px 0 0;padding:14px 16px calc(16px + env(safe-area-inset-bottom));z-index:35;box-shadow:0 -10px 40px -10px rgba(0,0,0,.25)}
.sheet .nav a{padding:11px 10px}

/* ---------- responsivo ---------- */
@media (max-width:1000px){
  .grid2,.ed{grid-template-columns:1fr}
  .dos{position:static;max-height:none}
  .since{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .main{padding:12px 16px 96px}
  .mtop{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
  .mtop .brand{padding:0}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--white);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:20}
  .tabbar a,.tabbar button{display:grid;justify-items:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--gray);position:relative;padding:4px 0}
  .tabbar [aria-current="page"]{color:var(--green-dk)}
  .tabbar .b{position:absolute;top:0;left:calc(50% + 6px);font-size:.62rem;font-weight:700;border-radius:999px;padding:0 5px;background:var(--rose);color:var(--rose-ink)}
  h1{font-size:1.3rem}
  .card{padding:15px 14px;border-radius:14px}
  .todo>div{grid-template-columns:auto minmax(0,1fr)}
  .todo .acts{grid-column:2;justify-content:flex-start}
  .rows>div{grid-template-columns:1fr}
  .rows .acts{justify-content:flex-start}
  .tri{grid-template-columns:auto minmax(0,1fr)}
  .tri .acts{grid-column:1/-1;flex-direction:row;flex-wrap:wrap}
  .mtabs{display:flex;margin-bottom:12px}
  .ed>.pane{display:none}
  .ed>.pane.show{display:block}
  .status{border-radius:14px}
}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="ovl"></div>
<div id="toast" role="status" aria-live="polite"></div>

  const num=(kw.match(/pl \d[\d.]*\/\d{4}/)||[""])[0];
  const r=[
    [num&&s.tit.toLowerCase().includes(num),"Palavra-chave no título"],
    [num&&s.slug.includes(num.replace(/[ /.]/g,m=>m==="."?"":"-")),"Palavra-chave no endereço"],
    [s.tit.length<=60,"Título com até 60 caracteres"],
    [s.desc.length<=155,"Descrição com até 155 caracteres"],
    [true,"4 links internos automáticos (lei, parlamentar, tema, bioma)"],
    [true,"Autor, data de publicação e dados estruturados"]
  ];
  return r.map(([ok,t])=>`<div class="${ok?"ok":"wa"}">${I(ok?IC.ok:IC.alerta,16)}${t}</div>`).join("");
}

function comCount(){
  const c=S.com; let n=0;
  const ps=c.modo==="todos"?Object.keys(AUD):c.perfis;

document.addEventListener("click",e=>{
  const t=e.target.closest("button,a,[data-close]"); if(!t) return;
  const d=t.dataset;
  if(d.close!==undefined&&(e.target===t||t.tagName==="BUTTON")){ document.getElementById("ovl").innerHTML=""; return; }
  if(d.more!==undefined){ document.getElementById("ovl").innerHTML=`<div class="ov" data-close style="place-items:end stretch;padding:0"><div class="sheet">${navLinks("")}</div></div>`; return; }
  if(t.closest(".sheet")&&t.tagName==="A"){ document.getElementById("ovl").innerHTML=""; return; }
  if(d.trif){ S.tab.tri=d.trif; return rerender(); }
  if(d.ptab){ S.tab.ped=d.ptab; return rerender(); }
  if(t.dataset.ptab==="imp") S.tab.ped="imp";
  if(d.ptab2){ S.tab.par=d.ptab2; return rerender(); }
  if(d.ctab){ S.tab.cont=d.ctab; return rerender(); }
  if(d.ativar){ return modalAtivar(d.ativar); }
  if(d.confativar){ const tr=TRI.find(x=>x.id===d.confativar); const i=TRI.indexOf(tr); TRI.splice(i,1);
    const key="n"+tr.id; P[key]={num:tr.num,titulo:tr.ementa.split(",")[0].replace(/\.$/,""),uf:tr.uf,casa:tr.fonte,st:"preparo",ativado:"14/10",prazo:`${14+S.cfg.parecer}/10`,dias:S.cfg.parecer,versao:"Texto original",sec:0,aviso:0,seguem:0};
    document.getElementById("ovl").innerHTML=""; rerender(); return toast(`${tr.num} ativado. Aviso “Parecer em preparação” no ar · prazo ${14+S.cfg.parecer}/10.`); }
  if(d.acomptri){ const tr=TRI.find(x=>x.id===d.acomptri); TRI.splice(TRI.indexOf(tr),1); rerender(); return toast(`${tr.num}: acompanhando. A página pública não promete parecer.`); }
  if(d.disc){ S.disc=S.disc===d.disc?null:d.disc; return rerender(); }
  if(d.discm){ const tr=TRI.find(x=>x.id===d.discm); TRI.splice(TRI.indexOf(tr),1); S.disc=null; rerender(); return toast(`Descartado (${d.m}). O motivo ajusta as palavras-chave.`); }
  if(d.acomp){ P[d.acomp].st="acompanhando"; rerender(); return toast(`Agora só acompanhando. O aviso público mudou para “Acompanhando”; ${P[d.acomp].aviso} pessoas serão avisadas quando houver novidade.`); }
  if(d.novadata){ const p=P[d.novadata]; p.prazo="19/10"; p.dias=5; rerender(); return toast(`Novo prazo: 19/10. O aviso público continua no ar.`); }
  if(d.ativarp){ const p=P[d.ativarp]; p.st="preparo"; p.prazo=`${14+S.cfg.parecer}/10`; p.dias=S.cfg.parecer; p.sec=0; p.aviso=0; p.versao=p.versao||"Texto vigente"; rerender(); return toast(`Parecer ativado. Prazo ${p.prazo}.`); }
  if(d.dtab){ S.dTab=d.dtab; return rerender(); }
  if(d.etab){ S.eTab=d.etab; return rerender(); }
  if(d.edpane){ S.edPane=d.edpane; return rerender(); }
  if(d.imp){ const [k,v]=d.imp.split("|"); S.cls[k].imp=v; return rerender(); }
  if(d.car){ const [k,v]=d.car.split("|"); S.cls[k].car=v; return rerender(); }
  if(d.area){ const [k,v]=d.area.split("|"); const a=S.cls[k].areas; a.includes(v)?a.splice(a.indexOf(v),1):a.push(v); return rerender(); }
  if(d.bio){ const [k,v]=d.bio.split("|"); const a=S.cls[k].biomas; a.includes(v)?a.splice(a.indexOf(v),1):a.push(v); return rerender(); }
  if(d.mat){ S.mats[d.mat]=true; rerender(); return toast("PDF enviado. Disponível só para inscritos."); }
  if(d.matx){ S.mats[d.matx]=false; return rerender(); }
  if(d.pmodo){ S.pubModo=d.pmodo; return rerender(); }
  if(d.publicar){ if(t.getAttribute("aria-disabled")==="true") return toast("Ainda não dá para publicar: resolva os itens em vermelho."); const k=d.publicar, p=P[k];
    if(S.pubModo==="agendar"){ p.st="agendado"; p.quando="15/10, 8h"; p.embargo=S.embargo; location.hash="#pareceres"; S.tab.par="agendado"; return toast("Agendado para 15/10, 8h."); }
    const n=p.aviso||0; p.st="publicado"; p.pub="14/10"; if(p.nova){p.versao=p.nova; delete p.nova;} location.hash="#pareceres"; S.tab.par="publicado"; return toast(`Publicado. ${n?n+" pessoas avisadas; ":""}página, gráficos, Timeline e sitemap atualizados.`); }
  if(d.cmodo){ S.com.modo=d.cmodo; return rerender(); }
  if(d.cp){ const a=S.com.perfis; if(a.includes(d.cp)){ a.splice(a.indexOf(d.cp),1); delete S.com.subs[d.cp]; } else a.push(d.cp); return rerender(); }
  if(d.cs){ const [p,k]=d.cs.split("|"); const a=S.com.subs[p]||(S.com.subs[p]=[]); a.includes(k)?a.splice(a.indexOf(k),1):a.push(k); return rerender(); }
  if(d.compara){ S.com={modo:"perfil",perfis:[d.compara],subs:{},uf:"",assunto:"",msg:""}; return; }
  if(d.cteste!==undefined){ return toast("Teste enviado para nome@exemplo.com."); }
  if(d.cagenda!==undefined||d.cenviar!==undefined){ const c=S.com; if(!c.assunto.trim()||!c.msg.trim()) return toast("Escreva o assunto e a mensagem."); if(c.modo==="perfil"&&!c.perfis.length) return toast("Escolha ao menos um perfil."); const n=comCount();
    S.com={modo:"todos",perfis:[],subs:{},uf:"",assunto:"",msg:""}; rerender(); return toast(d.cagenda!==undefined?`Comunicado agendado para ${n.toLocaleString("pt-BR")} pessoas.`:`Comunicado na fila de envio para ${n.toLocaleString("pt-BR")} pessoas.`); }
  if(d.sendRev!==undefined){ return toast("Enviado para revisão."); }
  if(d.prev!==undefined){ return toast("Prévia: como visitante, como inscrito e em PDF (no site real abre em nova aba)."); }
  if(d.coletar!==undefined){ S.coletando=true; rerender(); setTimeout(()=>{ S.coletando=false; S.senadoOk=true; rerender(); toast("Senado coletado: 71 itens. Nota pública retirada."); },1400); return; }
  if(d.resp){ S.resp[d.resp]=true; return rerender(); }
  if(d.enviar){ PED.corr=PED.corr.filter(c=>c.id!==d.enviar); rerender(); return toast("Resposta enviada. Correção registrada no parecer e na página de Correções."); }
  if(d.np){ PED.corr=PED.corr.filter(c=>c.id!==d.np); rerender(); return toast("Resposta enviada explicando por que o texto se mantém."); }
  if(d.cred){ const [id,a]=d.cred.split("|"); const c=PED.imp.find(x=>x.id===id); PED.imp=PED.imp.filter(x=>x.id!==id); rerender();
    return toast(a==="ok"?`${c.nome} credenciada. Selo e embargo liberados.`:a==="info"?`Pedido de mais informações enviado a ${c.nome}. O prazo fica suspenso até a resposta.`:`Recusa enviada a ${c.nome}, com o motivo.`); }
  if(d.lgpd){ PED.lgpd=PED.lgpd.filter(x=>x.id!==d.lgpd); rerender(); return toast("Dados excluídos e confirmação enviada."); }
});
document.addEventListener("input",e=>{
  const el=e.target, d=el.dataset;
  if(d.blk){ S.blocos[d.blk]=el.value; const k=d.blk.split("|")[0]; const n=secCount(k); const sn=document.getElementById("secn"); if(sn) sn.textContent=`${n} de 7 seções`; el.closest(".blk").classList.toggle("done",el.value.trim().length>20); if(P[k]) P[k].sec=n; const sv=document.getElementById("saved"); if(sv) sv.textContent="Salvo agora"; }
  if(el.id==="mud") S.mud=el.value;
  if(el.id==="nota") S.nota=el.value;
  if(el.id==="cas") S.com.assunto=el.value;
  if(el.id==="cmsg") S.com.msg=el.value;
  if(d.seo){ S.seo[d.seo]=el.value; const s=S.seo;
    document.getElementById("gt").textContent=s.tit+" | ênfase jur"; document.getElementById("gd").textContent=s.desc;
    const ct=document.getElementById("c-tit"); ct.textContent=s.tit.length+"/60"; ct.classList.toggle("over",s.tit.length>60);
    const cd=document.getElementById("c-desc"); cd.textContent=s.desc.length+"/155"; cd.classList.toggle("over",s.desc.length>155);
    document.querySelector(".gprev .u").textContent="nomedosite.com.br › pareceres › "+s.slug;
    document.getElementById("seochk").innerHTML=seoChk(); }
  if(d.cfg){ const v=parseInt(el.value,10); if(v>0) S.cfg[d.cfg]=v; }
  if(d.testkw!==undefined){ const v=el.value.trim(); document.getElementById("ttr").textContent=v?`“${v}” capturaria ${Math.max(1,(v.length*7)%40)} propostas nos últimos 30 dias (${Math.max(0,(v.length*3)%9)} já descartadas).`:"Mostra quantas propostas dos últimos 30 dias o termo capturaria."; }
});
document.addEventListener("change",e=>{ if(e.target.dataset.emb!==undefined) S.embargo=e.target.checked;
  if(e.target.id==="cuf"){ S.com.uf=e.target.value; document.getElementById("ccount").textContent=comCount().toLocaleString("pt-BR"); } });
document.addEventListener("keydown",e=>{ if(e.key==="Escape") document.getElementById("ovl").innerHTML=""; });
render();
</script>
</body>
