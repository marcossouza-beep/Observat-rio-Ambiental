<title>Observatório Ambiental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout fiel ao rascunho em PDF: moldura verde, página clara centralizada, cabeçalho com nome + "Se inscreva grátis".
   Visual único (claro), como no PDF. */
:root{
  --green:#38A96A; --green-dk:#2E8F59; --page:#FAFAFA; --white:#FFFFFF; --ink:#111111; --gray:#6B6B6B; --light:#BDBDBD; --line:#E3E3E3;
  --tag-state:#FBF3C7; --tag-status:#EEF38A; --cream:#FFFDF2; --mint:#EEFDF3; --rose:#FDE4E4;
  --impact:#FBF0C9; --bad:#EE8A8A; --good:#7FCF9C; --black:#000000;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--green)}
body{color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.5;padding-inline:clamp(0px,6vw,108px);padding-block:clamp(0px,4vw,60px) 0}
h1,h2,h3{margin:0;font-weight:600;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.page{background:var(--page);min-height:100vh;padding-inline:16px;padding-block:40px 80px}
.in{max-width:880px;margin:0 auto;display:grid;gap:28px}

/* cabeçalho */
.head{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--white);border-radius:10px;padding:14px 24px}
.brand{font-weight:600;font-size:1.05rem;text-decoration:none}
.btn-g{background:var(--green);color:#fff;border:0;border-radius:6px;padding:8px 14px;font-size:.88rem;font-weight:500}
.btn-g:hover{background:var(--green-dk)}
.btn-k{background:var(--black);color:#fff;border:0;border-radius:3px;padding:3px 9px;font-size:.72rem;font-weight:500;white-space:nowrap}
.filtro{justify-self:end;background:none;border:0;color:var(--gray);font-size:.9rem;padding:0}

/* busca */
.search{display:flex;align-items:center;gap:6px;border:1px solid var(--green);border-radius:8px;background:#F4F4F4;padding:4px;flex-wrap:wrap}
.search select{border:0;background:var(--white);border-radius:6px;padding:8px 10px;font:inherit;font-size:.88rem;color:var(--ink);flex:0 1 210px;min-width:0}
.search input{flex:1 1 200px;border:0;background:transparent;font:inherit;font-size:.9rem;padding:8px 10px;min-width:0;color:var(--ink)}
.search input::placeholder{color:var(--gray)}
.search .go{border:0;background:var(--white);border-radius:6px;padding:8px 12px;font-size:.88rem}

/* home */
.hero{text-align:center;display:grid;gap:8px;padding-top:12px}
.sub{color:var(--green);font-size:.85rem}
.hero h1{font-size:clamp(1.6rem,4vw,2.25rem);line-height:1.2}
.hero h1 em{font-style:normal;color:var(--green)}
.topics{display:grid;gap:6px}
.topics h2{font-size:1.65rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:24px;margin-top:16px}
.tile{display:grid;gap:2px;text-decoration:none;color:var(--ink)}
.tile i{display:block;aspect-ratio:1;max-width:100%;background:var(--green);border-radius:6px;margin-bottom:12px;transition:transform .15s}
.tile:hover i{transform:translateY(-3px)}
.tile b{font-weight:500;font-size:1rem}
.tile span{color:var(--gray);font-size:.85rem}

/* resultados */
.res-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.res-h h1{font-size:clamp(1.3rem,3vw,1.75rem);color:var(--light);font-weight:500}
hr{border:0;border-top:1px solid var(--line);margin:0 60px}
.list{display:grid;gap:40px}
.item{display:grid;gap:6px;justify-items:start}
.item .top{display:flex;justify-content:space-between;align-items:center;width:100%;gap:8px}
.tag{display:inline-block;font-size:.72rem;font-weight:500;padding:2px 6px;border-radius:2px;color:var(--ink)}
.t-state{background:var(--tag-state)}
.t-status{background:var(--tag-status)}
.t-imp{background:var(--impact);font-weight:600}
.t-bad{background:var(--bad);color:#fff;font-weight:600}
.t-good{background:var(--good);color:#fff;font-weight:600}
.item h3{font-size:1.6rem;margin-top:4px}
.item .num{color:var(--green);font-size:.92rem}
.item p{color:var(--gray);font-size:.92rem}
.item.f1{opacity:.75}.item.f2{opacity:.35}
.pager{display:flex;gap:8px;justify-content:center}
.pager button{border:1px solid var(--line);background:var(--white);border-radius:4px;min-width:32px;padding:4px 8px;font-size:.85rem}
.pager button[aria-current]{background:var(--green);color:#fff;border-color:var(--green)}

/* página da lei */
.card{border-radius:14px;padding:clamp(18px,4vw,36px);display:grid;gap:14px}
.c-law{background:var(--cream);position:relative}
.c-law .st{position:absolute;top:18px;right:18px}
.c-law .ttl{text-align:center;font-weight:700;font-size:.8rem;letter-spacing:.02em;text-transform:uppercase;padding-top:14px}
.c-law .em{text-align:center;color:#333;font-size:.92rem}
.c-law p{color:#333;font-size:.9rem}
.c-law .more{justify-self:center;border-radius:4px;padding:5px 14px;font-size:.75rem}
.c-par{background:var(--mint)}
.c-par h2,.c-mat h2{font-size:1.65rem}
.tags{display:grid;gap:6px;justify-items:start}
.c-par .dif{color:var(--green);font-size:.92rem}
.c-par p{color:var(--gray);font-size:.9rem;max-width:72ch}
.fade{position:relative;max-height:150px;overflow:hidden}
.fade::after{content:"";position:absolute;inset:auto 0 0 0;height:80px;background:linear-gradient(transparent,var(--mint))}
.unlock{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--gray)}
.c-mat{background:var(--rose)}
.files{display:flex;gap:14px;flex-wrap:wrap}
.file{display:flex;align-items:center;gap:14px;background:var(--white);border:0;border-radius:8px;padding:14px 20px;text-align:left;min-width:0;flex:0 1 260px;position:relative}
.file .ic{width:34px;height:40px;background:#E8E8E8;border-radius:3px;position:relative;flex:none}
.file .ic::after{content:"PDF";position:absolute;left:-4px;bottom:6px;background:#E44;color:#fff;font-size:.6rem;font-weight:700;padding:1px 4px;border-radius:2px}
.file b{display:block;font-size:.82rem;font-weight:600}
.file span{font-size:.75rem;color:var(--gray)}
.file .lock{position:absolute;top:6px;right:8px;font-size:.7rem;color:var(--gray)}
.back{font-size:.85rem;color:var(--gray);text-decoration:none}

/* modal de inscrição */
.scrim{position:fixed;inset:0;background:rgba(17,17,17,.5);display:grid;place-items:center;padding:16px;z-index:10}
.modal{background:var(--white);border-radius:12px;padding:24px;max-width:420px;width:100%;display:grid;gap:12px;max-height:90vh;overflow:auto}
.modal h2{font-size:1.3rem}
.modal p{color:var(--gray);font-size:.88rem}
.modal label{display:grid;gap:4px;font-size:.82rem;font-weight:500}
.modal input[type=text],.modal input[type=email],.modal select{font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:6px;padding:8px 10px;background:var(--white);color:var(--ink);width:100%}
.modal .chk{display:flex;gap:8px;font-weight:400;align-items:flex-start}
.modal .acts{display:flex;justify-content:flex-end;gap:8px}
.modal .ghost{background:none;border:0;color:var(--gray)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:.88rem;z-index:20}
.note{color:#fff;text-align:center;font-size:.75rem;padding:10px 16px;opacity:.9}

@media (max-width:600px){
  .head{padding:12px 14px}
  hr{margin:0}
  .item h3{font-size:1.3rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="page"><div class="in" id="app"></div></div>
<p class="note">Rascunho visual · layout do PDF · conteúdos e números fictícios</p>
<div id="layer"></div>

<script>
const LEIS = [
  {estado:"Estado do Pará", status:"Tramitação", titulo:"Unidade de Conservação", num:"Projeto de lei nº 123455",
   desc:"Cria a Reserva Extrativista do Baixo Rio Exemplo e define regras de uso sustentável pelas comunidades tradicionais."},
  {estado:"Federal", status:"Tramitação", titulo:"Licenciamento Ambiental", num:"Projeto de lei nº 123456",
   desc:"Simplifica o licenciamento de atividades agropecuárias de médio porte e transfere a competência aos municípios."},
  {estado:"Estado do Tocantins", status:"Aprovada", titulo:"Recursos Hídricos", num:"Projeto de lei nº 123457",
   desc:"Institui a outorga coletiva de uso da água para irrigação nas bacias dos rios Formoso e Javaés."},
];
const ESTADOS = ["Federal","Acre","Alagoas","Amapá","Amazonas","Bahia","Ceará","Distrito Federal","Espírito Santo","Goiás","Maranhão","Mato Grosso","Mato Grosso do Sul","Minas Gerais","Pará","Paraíba","Paraná","Pernambuco","Piauí","Rio de Janeiro","Rio Grande do Norte","Rio Grande do Sul","Rondônia","Roraima","Santa Catarina","São Paulo","Sergipe","Tocantins"];
const state = { inscrito:false, leiCompleta:false };

const $ = s => document.querySelector(s);
const go = r => { location.hash = r; };
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }

const head = () => `<header class="head"><a class="brand" href="#home">Nome do Blog/Site</a>
  <button class="btn-g" data-act="inscrever">${state.inscrito?"Inscrito ✓":"Se inscreva grátis"}</button></header>`;

function home(){
  return head()+`
  <section class="hero"><span class="sub">Observatório da legislação ambiental</span>
    <h1>Saiba tudo sobre leis <em>ambientais</em><br>mais recentes e seus <em>impactos reais.</em></h1></section>
  <div style="display:grid;gap:10px">
    <form class="search" onsubmit="event.preventDefault();go('resultados')">
      <select id="uf" aria-label="Estado"><option>Selecione um estado</option>${ESTADOS.map(e=>`<option>${e}</option>`).join("")}</select>
      <input id="q" type="text" placeholder="Adicione lei ou termo" aria-label="Lei ou termo">
      <button class="go">Pesquisar</button></form>
    <button class="filtro" onclick="go('resultados')">Filtro</button>
  </div>
  <section class="topics"><h2>Principais tópicos</h2><span class="sub">Navegue pelo conteúdo publicado</span>
    <div class="tiles">
      <a class="tile" href="#resultados"><i></i><b>Timeline</b><span>Ver tudo</span></a>
      <a class="tile" href="#resultados"><i></i><b>PEC Estadual</b><span>Leis recentes</span></a>
      <a class="tile" href="#resultados"><i></i><b>PEC Federal</b><span>Leis recentes</span></a>
      <a class="tile" href="#lei"><i></i><b>Opinião</b><span>Parecer técnico</span></a>
      <a class="tile" href="#resultados"><i></i><b>Artigos</b><span>Tendências</span></a>
    </div></section>`;
}

function resultados(){
  return head()+`
  <form class="search" onsubmit="event.preventDefault()"><input id="q2" type="text" placeholder="Adicione lei ou termo" aria-label="Lei ou termo"><button class="go">Pesquisar</button></form>
  <div class="res-h"><div style="display:grid;gap:4px"><h1>3 resultados da busca por: lei ambiental</h1><span class="sub">Ordenados pelos mais recentes</span></div><button class="filtro">Filtro</button></div>
  <hr>
  <div class="list">${LEIS.map((l,i)=>`<article class="item ${i===1?"f1":i===2?"f2":""}">
      <div class="top"><span class="tag t-state">${l.estado}</span><button class="btn-k" onclick="go('lei')">Ver mais detalhes</button></div>
      <span class="tag t-status">${l.status}</span>
      <h3>${l.titulo}</h3><span class="num">${l.num}</span><p>${l.desc}</p></article>`).join("")}</div>
  <nav class="pager" aria-label="Paginação"><button aria-current="page">1</button><button>2</button><button>3</button></nav>`;
}

function lei(){
  const ins = state.inscrito;
  const leiExtra = `<p>IV - assegurar às populações tradicionais o direito de uso dos recursos naturais renováveis, conforme plano de manejo;</p>
    <p>V - vedar a supressão de vegetação nativa fora das zonas de uso definidas.</p>
    <p>Art. 2º A gestão da Reserva caberá ao órgão ambiental estadual, com participação de conselho deliberativo.</p>
    <p>Art. 3º Esta Lei entra em vigor na data de sua publicação.</p>`;
  const parecerResto = `<p>O projeto acerta ao vincular o uso dos recursos ao plano de manejo, mas não define prazo para sua elaboração. Sem prazo, a Reserva pode permanecer anos sem regras efetivas de uso, o que historicamente favorece a ocupação irregular.</p>
    <p>O conselho deliberativo previsto no art. 2º não tem composição mínima definida. Recomenda-se assegurar paridade com as comunidades tradicionais e participação do Ministério Público e da universidade estadual.</p>
    <p><b>Conclusão:</b> impacto alto, com efeitos positivos condicionados à regulamentação. Os pontos críticos estão detalhados na Nota Técnica.</p>`;
  return head()+`
  <div style="display:flex;justify-content:space-between;align-items:center"><a class="back" href="#resultados">← Resultados</a><button class="filtro">Filtro</button></div>

  <section class="card c-law">
    <span class="tag t-status st">Em tramitação</span>
    <p class="ttl">Projeto de Lei nº 123455 - 22 de agosto de 2026</p>
    <p class="em">Cria a Reserva Extrativista do Baixo Rio Exemplo e dá outras providências....</p>
    <p>A Assembleia Legislativa do Estado do Pará decreta:</p>
    <p>Art. 1º Fica criada a Reserva Extrativista do Baixo Rio Exemplo, com área aproximada de 48.000 hectares.</p>
    <p>§ 1º A Reserva tem por objetivos:</p>
    <p>I - proteger os meios de vida e a cultura das populações extrativistas;</p>
    <p>II - assegurar o uso sustentável dos recursos naturais;</p>
    <p>III - conservar a biodiversidade da várzea e da terra firme....</p>
    ${state.leiCompleta?leiExtra:""}
    <button class="btn-k more" data-act="lei">${state.leiCompleta?"Ver menos":"Ver completo"}</button>
  </section>

  <section class="card c-par">
    <h2>Parecer técnico</h2>
    <div class="tags"><span class="tag t-imp">Alto Impacto</span><span class="tag t-good">Benéfico</span></div>
    <span class="dif">Diferença</span>
    <div class="${ins?"":"fade"}" style="display:grid;gap:14px">
      <p>Hoje a área não tem proteção legal específica e é alvo de pressão por extração de madeira e pesca predatória. Com o projeto, passa a ser unidade de conservação de uso sustentável, com prioridade de uso para as comunidades que já vivem ali.</p>
      ${parecerResto}
    </div>
    ${ins?"":`<div class="unlock"><button class="btn-g" data-act="inscrever">Se inscreva grátis</button><span>para ler o parecer completo</span></div>`}
  </section>

  <section class="card c-mat">
    <h2>Material completo</h2>
    <div class="tags"><span class="tag t-imp">Alto Impacto</span></div>
    <div class="files">
      <button class="file" data-act="pdf"><span class="ic"></span><span><b>Nota Técnica</b><span>Direito Ambiental</span></span>${ins?"":'<span class="lock">🔒</span>'}</button>
      <button class="file" data-act="pdf"><span class="ic"></span><span><b>Quadro comparativo</b><span>Lei vigente × projeto</span></span>${ins?"":'<span class="lock">🔒</span>'}</button>
    </div>
    ${ins?"":'<p style="font-size:.85rem;color:var(--gray)">Download liberado mediante inscrição gratuita.</p>'}
  </section>`;
}

function modal(){
  return `<div class="scrim" data-act="fechar"><form class="modal" id="f" onclick="event.stopPropagation()">
    <h2>Se inscreva grátis</h2>
    <p>Receba o parecer completo, a Nota Técnica em PDF e alertas quando as leis que você acompanha mudarem.</p>
    <label for="n">Nome<input id="n" type="text" required value="Maria Exemplo"></label>
    <label for="e">E-mail<input id="e" type="email" required value="maria@exemplo.com"></label>
    <label for="p">Perfil<select id="p"><option>Advogado(a)</option><option>Estudante</option><option>Servidor(a) público(a)</option><option>Empresa</option><option>ONG / movimento</option><option>Pesquisador(a)</option><option>Cidadão(ã)</option></select></label>
    <label for="s">Estado<select id="s">${ESTADOS.slice(1).map(e=>`<option ${e==="Tocantins"?"selected":""}>${e}</option>`).join("")}</select></label>
    <label class="chk"><input id="c" type="checkbox"> Concordo com a Política de Privacidade (LGPD)</label>
    <div class="acts"><button type="button" class="ghost" data-act="fechar">Cancelar</button><button class="btn-g">Inscrever</button></div>
  </form></div>`;
}

const PAGES = {home, resultados, lei};
function render(){ const r=(location.hash||"").slice(1); $("#app").innerHTML=(PAGES[r]||home)(); window.scrollTo(0,0); }
window.addEventListener("hashchange", render);
function abrirInscricao(){
  $("#layer").innerHTML = modal();
  $("#f").onsubmit = e=>{ e.preventDefault();
    if(!$("#c").checked){ toast("Marque a concordância com a Política de Privacidade"); return; }
    $("#layer").innerHTML=""; state.inscrito=true; toast("Inscrição confirmada · conteúdo completo liberado"); render(); };
}
document.addEventListener("click", ev=>{
  const a = ev.target.closest("[data-act]"); if(!a) return;
  const act = a.dataset.act;
  if (act==="inscrever" && !state.inscrito) abrirInscricao();
  if (act==="fechar" && (ev.target===a || a.tagName==="BUTTON")) $("#layer").innerHTML="";
  if (act==="lei"){ state.leiCompleta=!state.leiCompleta; const y=window.scrollY; render(); window.scrollTo(0,y); }
  if (act==="pdf"){ if(state.inscrito) toast("Download do PDF (simulação)"); else abrirInscricao(); }
});
render();
</script>
