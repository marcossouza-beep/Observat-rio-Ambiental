  const bar=`<div class="sbar ${small?"sm":""}" role="img" aria-label="${lab.map((l,i)=>l+" "+p[i]+"%").join(", ")}">${p.map((v,i)=>v?`<i class="${"minb"[i]}" style="flex:${v}" data-t="${lab[i]}: ${v}% (${Math.round(v*n/100)} de ${n})"></i>`:"").join("")}</div>`;
  if(small) return bar;
  return `<div class="sb">${bar}<div class="svals">${p.map((v,i)=>v?`<span><i class="${"minb"[i]}"></i>${v}%</span>`:"").join("")}</div></div>`;
}
function tendencia(a){
  if(a.n<AMOSTRA_MIN) return `<span class="trend tr-low">Amostra pequena</span>`;
  const d=a.p[3]-(a.p[0]+a.p[1]);
  return d>=15?`<span class="trend tr-pos" data-t="Propostas benéficas superam as que enfraquecem em ${d} pontos">Tende a proteger</span>`:d<=-15?`<span class="trend tr-neg" data-t="Propostas que enfraquecem (direta ou indiretamente) superam as benéficas em ${-d} pontos">Tende a enfraquecer</span>`:`<span class="trend tr-eq" data-t="Diferença menor que 15 pontos">Equilibrada</span>`;

  "Dep. Exemplo F":{mandato:"2023–2027 · 2º mandato",comissoes:["Meio Ambiente (titular)","Agricultura (titular)","Minas e Energia (suplente)"]},
  "Dep. Exemplo G":{mandato:"2023–2027 · 1º mandato",comissoes:["Meio Ambiente (titular)","Cultura (suplente)"]},
  "Sen. Exemplo M":{mandato:"2019–2027 · 1º mandato",comissoes:["Meio Ambiente (presidente)","Desenvolvimento Regional (titular)"]},
};
function cargoDe(nome){ return nome.startsWith("Dep. Est.")?["Deputado(a) estadual","Assembleia Legislativa","estadual"]:nome.startsWith("Dep.")?["Deputado(a) federal","Câmara dos Deputados","federal"]:["Senador(a)","Senado Federal","federal"]; }
function seed(str){ let h=2166136261; for(const c of str){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return ()=>{ h^=h<<13; h^=h>>>17; h^=h<<5; return ((h>>>0)%1000)/1000; }; }
function parlIndex(){
  const idx={};
  const add=(nome,pu,l,papel,extra)=>{ if(!nome||nome==="Ainda não designado") return; const k=slugify(nome); const uf=(pu||"").split("-")[1]||UF_NOME_R[l.local]||"DF";
    idx[k]=idx[k]||{slug:k,nome,pu:pu&&pu!=="—"?pu:"PART-"+uf,uf,autorias:[],relatorias:[],emendas:[]};
    if(papel==="autor") idx[k].autorias.push(l); if(papel==="relator") idx[k].relatorias.push(l); if(papel==="emenda") idx[k].emendas.push([l,...extra]); };
  LEIS.forEach(l=>{ const a=atores(l); add(a.autor[0],a.autor[1],l,"autor"); add(a.relator[0],a.relator[1],l,"relator"); (a.emendas||[]).forEach(e=>add(e[1],null,l,"emenda",[e[0],e[2]])); });
  return idx;
}
function parlData(slug){
  const P=parlIndex()[slug]; if(!P) return null;
  const [cargo,casa,esfera]=cargoDe(P.nome); const r=seed(P.nome);
  const casaVoto = cargo.startsWith("Senador")?"Senado":"Câmara";
  const pool=LEIS.filter(l=>l.car!=="Neutro" && (esfera==="federal" ? (VOTADO_EM[l.id]||[]).some(v=>v[0]===casaVoto) : (l.esfera==="estadual" && UF_NOME_R[l.local]===P.uf)));
  const lean=P.autorias.some(l=>l.car==="Maléfico"||l.car==="Enfraquece indiretamente")?0.75:0.3;  // tendência simulada
  const votos=pool.map((l,i)=>{ const x=r(); const neg=l.car!=="Benéfico"; const aus=x<0.12; const apoia=x<0.12?null:(r()<lean)===neg; 
    return {l,data:["08/10","30/09","24/09","17/09","10/09","03/09"][i%6],orgao:esfera==="federal"?(VOTADO_EM[l.id].find(v=>v[0]===casaVoto)[1]):"Assembleia Legislativa",voto:aus?"Ausente":apoia?"Sim":"Não",pro:aus?null:(neg?!apoia:apoia)}; });
  const nAut=P.autorias.length+Math.floor(r()*6)+2;
  const autP=(()=>{ const m=Math.round(lean*55+r()*10), i=Math.round(r()*15), n=Math.round(10+r()*15); return [m,i,n,Math.max(0,100-m-i-n)]; })();
  return {...P,cargo,casa,esfera,votos,nAut,autP,...(PARL_INFO[P.nome]||{mandato:"2023–2027",comissoes:["Meio Ambiente (suplente)"]})};
}

  const seg=state.seguindoP.includes(d.slug);

      <div><span class="sub-h">${d.cargo} · ${d.casa}</span><h1>${d.nome}</h1><div class="meta"><span>${d.pu.split("-")[0]} · ${UF_NOME[d.uf]||d.uf}</span><span>Mandato ${d.mandato}</span></div></div>
      <div class="parl-acts"><button class="mini ${seg&&state.inscrito?"on":""}" data-seguir-p="${d.slug}">${ICO_BELL}${seg&&state.inscrito?"Seguindo":"Seguir"}</button></div></header>
    <div class="kpis pstats"><div class="kpi"><b>${d.nAut}</b><span>propostas ambientais de autoria${est?" monitoradas":""}</span></div><div class="kpi"><b>${d.relatorias.length}</b><span>relatorias</span></div><div class="kpi"><b>${d.emendas.length}</b><span>emendas</span></div>${est?`<div class="kpi"><b>${d.autorias.filter(l=>l.parecer).length}</b><span>com parecer publicado</span></div>`:`<div class="kpi"><b>${tot?Math.round((tot-aus)/tot*100):0}%</b><span>presença em votações ambientais</span></div>`}</div>
    ${est?`<p class="datanote" style="margin-top:14px">A ${ALE_SIGLA[d.uf]||"Assembleia"} não publica votos nominais em formato aberto. Por isso esta página mostra só o que o deputado propôs, relatou e emendou nas leis que acompanhamos.</p>`:`<div class="comm" style="margin-top:14px">${d.comissoes.map(c=>`<span>${c}</span>`).join("")}</div>`}
    <div class="ptabs2" role="tablist">${tabs.map(t=>`<button role="tab" data-ptab2="${t[0]}" aria-selected="${parlSel.tab===t[0]}">${t[1]}</button>`).join("")}</div>
    <section style="padding-block:18px 10px" id="parlbody">${body}</section>

  </div>`;
}

const MSECS=[["m1","Do projeto ao parecer"],["m2","Como classificamos"],["m3","Indicadores"],["m4","Fontes"],["m5","Automação e IA"],["m6","Independência e limites"],["m7","Correções"],["m8","Perguntas frequentes"]];

function metodologia(){
  return `<div class="rep">
    <header class="rep-head"><span class="eyebrow">Metodologia</span><h1>Como lemos, classificamos e medimos as leis ambientais</h1>
      <p style="color:var(--gray);font-size:1.05rem;max-width:62ch">Tudo o que o observatório publica segue o mesmo método. Esta página explica cada etapa, os critérios das etiquetas e as regras dos gráficos, para que qualquer pessoa possa conferir e discordar com base.</p>
      <div class="meta"><span>Versão do método <b>1.0</b></span><span>Atualizada em <b>14/10/2026</b></span></div></header>
    <div class="rep-body">
      <nav class="toc" aria-label="Nesta página"><small>Nesta página</small>${MSECS.map((x,i)=>`<a href="#metodologia" data-jump="${x[0]}" class="${i===0?"on":""}"><span>${i+1}</span>${x[1]}</a>`).join("")}</nav>
      <article>
        <section class="rsec" id="m1"><h2><span>1</span>Do projeto ao parecer</h2>
          <ol class="flow">
            <li><div><b>Monitoramento</b><p>Todos os dias coletamos novas proposições, tramitações, pautas, votações, sanções e vetos nas fontes oficiais.</p><span class="who m">Automático</span></div></li>
            <li><div><b>Triagem</b><p>Um dicionário de palavras-chave separa o que pode ser ambiental e monta o dossiê de cada proposta (texto integral, versões, tramitação, autores). O autor decide o que entra, o que só é acompanhado e o que é descartado.</p><span class="who hm">Automático + pessoa</span></div></li>
            <li><div><b>Análise</b><p>O autor lê o texto integral, compara as versões (substitutivos, emendas), a justificativa e a legislação que a proposta altera.</p><span class="who h">Pessoa</span></div></li>
            <li><div><b>Parecer, nota técnica e quadro comparativo</b><p>Escritos integralmente pelo autor indicado, em modelos fixos. O <b>parecer</b>, aberto a todos, esclarece e classifica: em uma frase, o que é, como é hoje e como fica, classificação, por que importa, pontos de atenção e próximos passos. A <b>nota técnica</b> (3 páginas) faz a análise completa: problema, hipótese, impactos, cenários, soluções e casos de referência. O <b>quadro comparativo</b> mostra, artigo por artigo, o texto vigente e o proposto. O autor assina e responde pelos três.</p><span class="who h">Pessoa</span></div></li>
            <li><div><b>Publicação e atualização</b><p>O parecer informa a versão do texto analisado. Se o texto mudar, publicamos nova versão do parecer e mantemos o histórico.</p><span class="who h">Pessoa</span></div></li>
          </ol></section>

        <section class="rsec" id="m2"><h2><span>2</span>Como classificamos</h2>
          <p>Cada parecer recebe duas etiquetas: o <b>caráter</b> (para que lado a proposta move a proteção ambiental) e o <b>impacto</b> (o tamanho do efeito).</p>
          <h3 style="font-size:1.05rem;margin-top:6px">Caráter</h3>
          <div class="cscale" role="group" aria-label="Categorias de caráter">${CARATER.map(c=>`<button class="cbox" data-car="${c.k}" aria-pressed="${metSel.car===c.k}"><span class="sw2" style="background:${c.cor}"></span><b>${c.nome}</b><span>${c.sub}</span></button>`).join("")}</div>
          <div id="cex">${cexHTML()}</div>
          <h3 style="font-size:1.05rem;margin-top:14px">Impacto</h3>
          <div class="tw"><table class="crit"><thead><tr><th>Nível</th><th>Quando usamos</th></tr></thead><tbody>
            <tr><td><span class="tag tg-alto">Alto</span></td><td>Atinge um bioma inteiro, uma norma geral (como o licenciamento) ou muitas pessoas; ou o dano é difícil de reverter.</td></tr>
            <tr><td><span class="tag tg-alto" style="opacity:.8">Médio</span></td><td>Efeito regional ou setorial, com possibilidade de correção por regulamento ou fiscalização.</td></tr>
            <tr><td><span class="tag tg-alto" style="opacity:.6">Baixo</span></td><td>Efeito local, pontual ou só procedimental.</td></tr></tbody></table></div>
          <p class="method">Na dúvida entre dois níveis, usamos o mais alto e explicamos o motivo no parecer.</p></section>

        <section class="rsec" id="m3"><h2><span>3</span>Indicadores</h2>
          <p>Os gráficos do Panorama, dos estados, das casas e dos parlamentares são contagens dos nossos pareceres. Eles medem o conteúdo das propostas, não o mérito das pessoas.</p>
          <div class="rules">
            <div class="rule"><b>Padrão de atuação</b><p>Percentual de pareceres em cada caráter, por casa ou estado. Mostramos tudo que tramitou e, separado, só o que foi aprovado.</p></div>
            <div class="rule"><b>Tendência</b><p><code>benéficos − (maléficos + indiretos)</code>. A partir de 15 pontos: "tende a proteger"; abaixo de −15: "tende a enfraquecer"; entre os dois: "equilibrada".</p></div>
