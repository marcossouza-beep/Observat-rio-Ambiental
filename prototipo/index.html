<style>
/* Leve e arejado: uma coluna central, busca como ação principal, lista que filtra na hora, página da lei em três passos. */
:root{
  --green:#2FA765; --green-dk:#23864F; --green-50:#EAF7EF; --green-100:#D3EFDD;
  --bg:#FBFCFB; --white:#FFFFFF; --ink:#16201A; --gray:#66726B; --soft:#9AA59F; --line:#E6ECE8;
  --pol-neg:#C2551F; --pol-ind:#E9A04F; --pol-mid:#C9CFCB; --pol-pos:#1F7A4D; --sun:#FFF6CF; --sun-ink:#7A5B00; --lime:#EDF5A8; --lime-ink:#4F5A00; --rose:#FDE7E7; --rose-ink:#B23B3B; --sky:#E5F0FF; --sky-ink:#2C5AA0; --cream:#FFFDF4;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.15}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px}

/* cabeçalho */

.head.scrolled{border-bottom-color:var(--line)}
.head .wrap{max-width:1040px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}

.foot .brand i{height:34px}
.pill-btn{background:var(--green);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:.9rem;transition:background .15s,transform .15s}
.pill-btn:hover{background:var(--green-dk);transform:translateY(-1px)}
.pill-btn.done{background:var(--green-50);color:var(--green-dk)}

/* hero */
.hero{padding-block:56px 28px;display:grid;gap:22px;text-align:center}
.hero h1{font-size:clamp(2rem,5.4vw,3rem);font-weight:800}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{color:var(--gray);max-width:46ch;margin:0 auto}
.search{display:flex;align-items:center;gap:6px;background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 6px 24px -12px rgba(22,32,26,.18);transition:border-color .15s}
.search:focus-within{border-color:var(--green)}
.search svg{flex:none;color:var(--soft)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;padding:8px 4px;color:var(--ink)}
.search input::placeholder{color:var(--soft)}

/* chips de filtro */
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:500;color:var(--gray);transition:all .15s}
.chip:hover{border-color:var(--green);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* tópicos */
.section{padding-block:28px;display:grid;gap:16px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.section-h h2{font-size:1.35rem;font-weight:700}
.section-h span{color:var(--soft);font-size:.88rem}
.topics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.topic{background:var(--green-50);border-radius:18px;padding:16px 14px;display:grid;gap:10px;align-content:start;transition:transform .2s,background .2s;border:0;text-align:left}
.topic:hover{transform:translateY(-4px);background:var(--green-100)}
.topic[aria-pressed="true"]{background:var(--green);color:#fff}
.topic[aria-pressed="true"] small{color:#E4F6EB}
.topic svg{width:26px;height:26px;color:var(--green-dk)}
.topic[aria-pressed="true"] svg{color:#fff}
.topic b{font-weight:700;font-size:.98rem;line-height:1.2}
.topic small{color:var(--gray);font-size:.8rem}

/* lista */
.list{display:grid;gap:12px}
.law{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:8px;transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .35s ease both}
.law:hover{transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(22,32,26,.35);border-color:var(--green-100)}
.law .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.law h3{font-size:1.18rem;font-weight:700}
.law p{color:var(--gray);font-size:.95rem}
.law .go{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.law .num{color:var(--green-dk);font-size:.85rem;font-weight:600}
.arrow{font-weight:600;font-size:.9rem;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.ico{width:1.05em;height:1.05em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.17em;transition:transform .2s ease}
a:hover .ico-r,button:hover .ico-r,.law:hover .ico-r,.op:hover .ico-r{transform:translateX(3px)}
a:hover .ico-l{transform:translateX(-3px)}
.go-c{width:34px;height:34px;border-radius:50%;background:var(--green-50);color:var(--green-dk);display:inline-grid;place-items:center;transition:background .2s,color .2s}
.go-c .ico{width:16px;height:16px}
a:hover .go-c{background:var(--green);color:#fff}
.back{align-items:center;gap:6px}
.mx .ico{width:18px;height:18px}
.cmp-row .arr .ico{width:18px;height:18px}
.law:hover .arrow{color:var(--green-dk)}
.empty{text-align:center;color:var(--soft);padding:24px}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tg-place{background:var(--white);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.flag{width:18px;height:12px;flex:none;border-radius:2px;display:inline-block;vertical-align:-2px}
.tag .flag{margin-left:-4px}
.flag.lg{width:48px;height:32px;border-radius:5px;box-shadow:0 2px 8px -3px rgba(22,32,26,.35)}
.flag.md{width:27px;height:18px;border-radius:3px}
.uf-title{display:flex;align-items:center;gap:12px}
.withflag{display:inline-flex;align-items:center;gap:8px}
.m-nav{display:none}
@media (max-width:560px){.m-nav{display:grid;gap:2px}}
.ig small .flag{margin-right:6px;vertical-align:-1px}
.tg-tram{background:var(--lime);color:var(--lime-ink)}
.tg-apr{background:var(--sky);color:var(--sky-ink)}
.tg-alto{background:var(--sun);color:var(--sun-ink)}
.tg-mal{background:var(--rose);color:var(--rose-ink)}
.tg-ben{background:var(--green-50);color:var(--green-dk)}
.tg-neu{background:#EEF1EF;color:var(--gray)}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.cta{margin-block:20px 64px;background:var(--green);color:#fff;border-radius:24px;padding:28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.cta h2{font-size:1.35rem;font-weight:700}
.cta p{opacity:.9;font-size:.95rem}
.cta .pill-btn{background:#fff;color:var(--green-dk)}

/* página da lei */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--gray);font-size:.9rem;margin-top:24px}
.back:hover{color:var(--ink)}
.lawhead{padding-block:18px 8px;display:grid;gap:12px}
.lawhead h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800}
.lawhead .num{color:var(--green-dk);font-weight:600;font-size:.92rem}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:4;display:flex;gap:6px;background:var(--bg);padding-block:10px;overflow-x:auto}
.steps a{flex:1;text-align:center;padding:9px 12px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--gray);background:var(--white);border:1px solid var(--line);white-space:nowrap;transition:all .15s}
.steps a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.block{border-radius:22px;padding:clamp(20px,4vw,30px);display:grid;gap:14px;margin-top:14px;scroll-margin-top:130px}
.b-law{background:var(--cream);border:1px solid #F3ECCB}
.b-par{background:var(--green-50)}
.b-mat{background:var(--rose)}
.b-pend{background:var(--white);border:1.5px dashed var(--green-100)}
.pend-h{display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;align-items:start}
.pend-h p{color:var(--gray);margin-top:4px}
.pend-ico{width:44px;height:44px;border-radius:14px;background:var(--green-50);color:var(--green-dk);display:grid;place-items:center}
.pend-ico svg{width:22px;height:22px}
.pend-facts{background:var(--bg);border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.pend-facts p{font-size:.95rem}
.pend-facts small{color:var(--soft);font-size:.8rem}
.tg-soon{background:var(--green-50);color:var(--green-dk)}
.block h2{font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:10px}
.block h2 small{font-size:.8rem;font-weight:600;color:var(--soft)}
.lawtext{display:grid;gap:10px;color:#3A443E;font-size:.97rem}
.lawtext .ttl{font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.collapsible{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.collapsible.open{grid-template-rows:1fr}
.collapsible > div{overflow:hidden;display:grid;gap:10px}
.link-btn{justify-self:start;background:none;border:0;padding:0;font-weight:600;color:var(--ink);font-size:.92rem;border-bottom:2px solid var(--ink)}
.quick{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
.quick div{background:var(--white);border-radius:14px;padding:14px;display:grid;gap:4px;align-content:start}
.quick b{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--green-dk)}
.quick span{font-size:.93rem}
.par{display:grid;gap:12px;color:#3A443E;max-width:64ch}
.unlock{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--gray);font-size:.92rem}
.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.file{display:flex;align-items:center;gap:14px;background:var(--white);border:0;border-radius:16px;padding:14px 16px;text-align:left;transition:transform .2s}
.file:hover{transform:translateY(-2px)}
.file .ic{width:38px;height:44px;border-radius:6px;background:var(--rose);color:var(--rose-ink);display:grid;place-items:center;font-size:.66rem;font-weight:800;flex:none}
.file b{display:block;font-size:.95rem}
.file span{font-size:.82rem;color:var(--gray)}
.file .st{margin-left:auto;font-size:.8rem;color:var(--gray);white-space:nowrap}
.b-who{background:var(--white);border:1px solid var(--line)}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.person{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:12px 14px;min-width:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;background:var(--green-100);color:var(--green-dk)}
.av.rel{background:var(--sky);color:var(--sky-ink)}
.person small{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700}
.person b{display:block;font-size:.98rem}
.person span{font-size:.85rem;color:var(--gray)}
.sub-h{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700}
.votes{display:grid;gap:8px}
.vbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line)}
.vbar span{display:block;height:100%}
.vleg{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--gray)}
.vleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.parties{display:grid;gap:6px}
.party{display:grid;grid-template-columns:minmax(0,1fr) 90px 70px;gap:10px;font-size:.88rem;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.party:last-child{border-bottom:0}
.party em{font-style:normal;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;justify-self:start}
.o-sim{background:var(--green-50);color:var(--green-dk)} .o-nao{background:var(--rose);color:var(--rose-ink)} .o-lib{background:var(--line);color:var(--gray)}
.emendas{display:grid;gap:8px}
.emenda{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:.92rem}
.emenda .n{background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:.75rem;border-radius:8px;padding:3px 8px}
.emenda span{color:var(--gray);font-size:.84rem;display:block}
.path{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.path div{flex:1;min-width:92px;display:grid;gap:6px;justify-items:center;text-align:center;font-size:.78rem;color:var(--soft);position:relative}
.path div::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.path div:first-child::before{display:none}
.path i{width:16px;height:16px;border-radius:50%;background:var(--white);border:2px solid var(--line);position:relative;z-index:1}
.path .ok{color:var(--ink)} .path .ok i{background:var(--green);border-color:var(--green)} .path .ok::before{background:var(--green)}
.path .now{color:var(--ink);font-weight:700} .path .now i{background:var(--white);border-color:var(--green);box-shadow:0 0 0 4px var(--green-50)} .path .now::before{background:var(--green)}
.foot{color:var(--soft);font-size:.8rem;padding-block:34px 40px;border-top:1px solid var(--line);margin-top:30px;padding-inline:20px}
.foot-in{max-width:1040px;margin:0 auto;display:flex;flex-wrap:wrap;gap:14px 28px;align-items:center;justify-content:space-between}
.foot nav{display:flex;flex-wrap:wrap;gap:6px 18px}
.foot nav a{color:var(--gray);font-size:.88rem}
.foot nav a:hover{color:var(--ink)}

/* inscrição */
.scrim{position:fixed;inset:0;background:rgba(22,32,26,.45);display:grid;place-items:center;padding:16px;z-index:20;animation:fade .2s ease}
.modal{background:var(--white);border-radius:22px;padding:26px;max-width:400px;width:100%;display:grid;gap:14px;animation:rise .25s ease}
.modal h2{font-size:1.4rem;font-weight:800}
.modal p{color:var(--gray);font-size:.92rem}
.modal input,.modal select{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--white);color:var(--ink)}
.modal input:focus,.modal select:focus{outline:0;border-color:var(--green)}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .chk{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--gray)}
.modal .chk input{width:auto;margin-top:3px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ghost{background:none;border:0;color:var(--gray);padding:8px}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:16px;font-size:.9rem;z-index:30;animation:rise .25s ease;width:max-content;max-width:calc(100vw - 32px);text-align:center}


/* ---------- inscrição ---------- */
.sign{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:40px;align-items:start;padding-block:48px 72px}
.sign-l{display:grid;gap:20px;position:sticky;top:100px}
.sign-l h1{font-size:clamp(1.8rem,4.4vw,2.5rem);font-weight:800}
.sign-l h1 em{font-style:normal;color:var(--green)}
.sign-l > p{color:var(--gray)}
.perks{display:grid;gap:14px;margin:0;padding:0;list-style:none}
.perks li{display:grid;grid-template-columns:40px minmax(0,1fr);gap:12px;align-items:start}
.perks .pi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--green-50);color:var(--green-dk)}
.perks .pi svg{width:20px;height:20px}
.perks b{display:block}
.perks span{color:var(--gray);font-size:.9rem}
.assure{display:flex;gap:8px;flex-wrap:wrap}
.assure span{font-size:.8rem;color:var(--green-dk);background:var(--green-50);padding:4px 10px;border-radius:999px;font-weight:600}
.formcard{background:var(--white);border:1px solid var(--line);border-radius:24px;padding:clamp(20px,4vw,32px);display:grid;gap:20px;box-shadow:0 20px 50px -30px rgba(22,32,26,.35)}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.prog div{display:grid;gap:6px;font-size:.78rem;font-weight:600;color:var(--soft)}
.prog div::before{content:"";height:4px;border-radius:999px;background:var(--line);transition:background .3s}
.prog .on{color:var(--ink)} .prog .on::before,.prog .ok::before{background:var(--green)}
.prog .ok{color:var(--green-dk)}
.fstep{display:grid;gap:14px;animation:rise .3s ease both}
.fstep h2{font-size:1.25rem;font-weight:700}
.fstep > p{color:var(--gray);font-size:.92rem;margin-top:-8px}
.field{display:grid;gap:6px;font-size:.85rem;font-weight:600}
.field input,.field select{font:inherit;font-weight:400;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--white);color:var(--ink)}
.field input:focus,.field select:focus{outline:0;border-color:var(--green)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:7px 14px;font-size:.88rem;font-weight:500;transition:all .15s}
.opt:hover{border-color:var(--green)}
.opt[aria-pressed="true"]{background:var(--green-50);border-color:var(--green);color:var(--green-dk);font-weight:600}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 14px;border:1.5px solid var(--line);border-radius:14px}
.toggle b{display:block;font-size:.95rem}
.toggle span{color:var(--gray);font-size:.84rem}
.sw{position:relative;width:44px;height:26px;flex:none;border-radius:999px;background:var(--line);border:0;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--green)} .sw[aria-checked="true"]::after{transform:translateX(18px)}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:.85rem;color:var(--gray)}
.consent input{margin-top:3px}
.fnav{display:flex;justify-content:space-between;align-items:center;gap:10px}
.done-card{display:grid;gap:14px;justify-items:center;text-align:center;padding-block:20px;animation:rise .35s ease both}
.check{width:64px;height:64px;border-radius:50%;background:var(--green);display:grid;place-items:center;color:#fff}
.check svg{width:30px;height:30px;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .5s .15s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done-card h2{font-size:1.5rem;font-weight:800}
.done-card p{color:var(--gray);max-width:36ch}
.mail{font-weight:600;color:var(--ink);background:var(--green-50);padding:4px 10px;border-radius:8px}

/* ---------- relatório do parecer ---------- */
.readbar{position:fixed;top:env(safe-area-inset-top,0px);left:0;height:3px;background:var(--green);z-index:10;width:0;transition:width .1s linear}
.rep{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:8px 72px}
.rep-head{display:grid;gap:14px;padding-block:18px 26px;max-width:760px}
.rep-head .eyebrow{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--green-dk);font-weight:700}
.rep-head h1{font-size:clamp(1.9rem,4.8vw,2.7rem);font-weight:800}
.meta{display:flex;flex-wrap:wrap;gap:6px 18px;color:var(--gray);font-size:.88rem}
.meta b{color:var(--ink);font-weight:600}
.verdict{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:12px}
.vcard{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:10px;align-content:start}
.vcard small{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700}
.vcard .big{font-size:1.35rem;font-weight:800;line-height:1.1}
.meter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.meter span{height:8px;border-radius:999px;background:var(--line)}
.meter .f{background:var(--sun-ink)}
.mlab{display:flex;justify-content:space-between;font-size:.75rem;color:var(--soft)}
.scale{position:relative;height:8px;border-radius:999px;background:linear-gradient(90deg,var(--pol-neg),var(--pol-ind) 30%,#C9CFCB 52%,var(--pol-pos))}
.scale i{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--ink);transform:translate(-50%,-50%)}
.oneline{background:var(--ink);color:#fff;border-radius:18px;padding:18px 22px;font-size:1.08rem;line-height:1.5;margin-bottom:34px}
.oneline b{color:#9BE3B8}
.rep-body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
.toc{position:sticky;top:96px;display:grid;gap:2px}
.toc small{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700;padding:0 10px 8px}
.toc a{display:flex;gap:10px;padding:7px 10px;border-radius:10px;font-size:.9rem;color:var(--gray);transition:all .15s}
.toc a span{font-variant-numeric:tabular-nums;color:var(--soft);font-weight:600}
.toc a:hover{background:var(--white);color:var(--ink)}
.toc a.on{background:var(--green-50);color:var(--green-dk);font-weight:600}
.toc a.on span{color:var(--green-dk)}
.rsec{display:grid;gap:14px;padding-block:6px 34px;scroll-margin-top:90px}
.rsec h2{font-size:1.35rem;font-weight:700;display:flex;gap:12px;align-items:baseline}
.rsec h2 span{color:var(--green);font-size:1rem;font-variant-numeric:tabular-nums}
.rsec > p{color:#3A443E;max-width:66ch}
.facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.facts div{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.facts b{font-size:1.25rem;font-weight:800;font-variant-numeric:tabular-nums}
.facts span{font-size:.82rem;color:var(--gray)}
.cmp{display:grid;gap:8px}
.cmp-row{display:grid;grid-template-columns:minmax(0,1fr) 28px minmax(0,1fr);gap:8px;align-items:stretch}
.cmp-row > div{border-radius:14px;padding:12px 14px;font-size:.93rem}
.cmp-row .bef{background:var(--white);border:1px solid var(--line);color:var(--gray)}
.cmp-row .aft{background:var(--green-50);color:var(--ink)}
.cmp-row .arr{display:grid;place-items:center;color:var(--soft);font-weight:700}
.cmp-row small{display:block;font-size:.7rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-bottom:2px;color:var(--soft)}
.cmp-row .aft small{color:var(--green-dk)}
.chart{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:12px;position:relative}
.chart-cap{display:flex;justify-content:space-between;gap:10px;font-size:.78rem;color:var(--soft);font-weight:600}
.drow{display:grid;grid-template-columns:110px minmax(0,1fr) 120px;gap:12px;align-items:center;font-size:.9rem;cursor:default;border-radius:8px}
.drow:focus-visible{outline:2px solid var(--green)}
.drow .lab{font-weight:600}
.dtrack{position:relative;height:22px}
.dtrack::before{content:"";position:absolute;left:50%;top:-4px;bottom:-4px;border-left:1.5px solid #C9CFCB}
.dbar{position:absolute;top:4px;height:14px}
.dbar.pos{left:calc(50% + 2px);background:var(--pol-pos);border-radius:0 4px 4px 0}
.dbar.neg{right:calc(50% + 2px);background:var(--pol-neg);border-radius:4px 0 0 4px}
.dbar.zero{left:calc(50% - 3px);width:6px;background:#C9CFCB;border-radius:3px}
.drow .val{font-size:.84rem;color:var(--gray)}
.drow:hover .lab,.drow:focus .lab{color:var(--green-dk)}
.tip{position:absolute;z-index:3;max-width:260px;background:var(--ink);color:#fff;font-size:.82rem;line-height:1.4;padding:9px 12px;border-radius:10px;pointer-events:none;box-shadow:0 8px 20px -8px rgba(0,0,0,.4)}
.alerts{display:grid;gap:10px}
.al{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.al .chipst{font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap;align-self:start}
.st-pos{background:var(--green-50);color:var(--green-dk)} .st-att{background:var(--sun);color:var(--sun-ink)} .st-crit{background:var(--rose);color:var(--rose-ink)}
.al b{display:block;margin-bottom:2px}
.al p{color:var(--gray);font-size:.9rem}
.laws{display:flex;flex-wrap:wrap;gap:8px}
.lawchip{border:1.5px solid var(--line);background:var(--white);border-radius:12px;padding:8px 12px;font-size:.88rem;font-weight:600;text-align:left;transition:all .15s}
.lawchip span{display:block;font-weight:400;color:var(--gray);font-size:.8rem}
.lawchip[aria-expanded="true"]{border-color:var(--green);background:var(--green-50)}
.lawnote{background:var(--white);border-left:3px solid var(--green);border-radius:0 12px 12px 0;padding:12px 16px;font-size:.92rem;color:#3A443E}
.recs{display:grid;gap:10px;counter-reset:r;margin:0;padding:0;list-style:none}
.recs li{counter-increment:r;display:grid;grid-template-columns:32px minmax(0,1fr);gap:12px;align-items:start}
.recs li::before{content:counter(r);width:32px;height:32px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.9rem}
.recs li span{padding-top:4px}
.concl{background:var(--green);color:#fff;border-radius:22px;padding:24px 26px;display:grid;gap:12px}
.concl p{font-size:1.05rem;line-height:1.55}
.concl .row{display:flex;gap:8px;flex-wrap:wrap}
.concl .tag{background:rgba(255,255,255,.18);color:#fff}
.rep-foot{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;margin-top:8px}
.panel-s{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:12px;align-content:start}
.panel-s h3{font-size:1.05rem;font-weight:700}
.panel-s p{color:var(--gray);font-size:.9rem}
.cite{font-size:.84rem;background:var(--bg);border-radius:10px;padding:10px 12px;color:#3A443E;user-select:all}
.btn-o{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:8px 14px;font-weight:600;font-size:.88rem;justify-self:start}
.btn-o:hover{border-color:var(--green)}
.rep-foot{grid-template-columns:1fr!important}
.head.wide .wrap{max-width:1040px}
.to-report{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--green-100);padding-top:14px}
.to-report span{color:var(--gray);font-size:.9rem}

@media (max-width:860px){
  .sign,.rep-body,.rep-foot{grid-template-columns:1fr}
  .sign-l{position:static}
  .toc{position:static;display:flex;overflow-x:auto;gap:4px}
  .toc small{display:none}
  .toc a{white-space:nowrap;background:var(--white);border:1px solid var(--line)}
  .verdict,.facts{grid-template-columns:1fr}
  .drow{grid-template-columns:90px minmax(0,1fr)}
  .drow .val{grid-column:2}
  .cmp-row{grid-template-columns:1fr}
  .cmp-row .arr{transform:rotate(90deg);height:16px}
}


/* ---------- cabeçalho do assinante ---------- */
.nav{display:flex;align-items:center;gap:4px;margin-left:auto;margin-right:8px}
.nav a{padding:7px 10px;border-radius:999px;font-size:.92rem;font-weight:500;color:var(--gray);transition:all .15s}
.nav a:hover{color:var(--ink);background:var(--white)}
.nav a.on{color:var(--ink);background:var(--white);box-shadow:0 0 0 1px var(--line)}
.nav .cnt{font-size:.72rem;font-weight:700;background:var(--green);color:#fff;border-radius:999px;padding:1px 7px;margin-left:4px}
.enter{background:none;border:0;font-weight:600;font-size:.92rem;padding:8px 10px;color:var(--ink)}
.me{position:relative}
.avatar{width:38px;height:38px;border-radius:50%;border:2px solid var(--white);box-shadow:0 0 0 1.5px var(--green-100);background:var(--green-50);color:var(--green-dk);font-weight:700;font-size:.85rem;display:grid;place-items:center;transition:box-shadow .15s}
.avatar:hover,.avatar[aria-expanded="true"]{box-shadow:0 0 0 2px var(--green)}
.menu{position:absolute;right:0;top:calc(100% + 10px);width:290px;background:var(--white);border:1px solid var(--line);border-radius:18px;box-shadow:0 24px 50px -24px rgba(22,32,26,.35);padding:8px;display:grid;gap:2px;z-index:15;animation:rise .2s ease}
.menu .who{padding:10px 12px 12px;border-bottom:1px solid var(--line);margin-bottom:6px}
.menu .who b{display:block}
.menu .who span{font-size:.85rem;color:var(--gray)}
.menu .mrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 12px;border-radius:10px;font-size:.9rem}
.menu .mrow select{font:inherit;font-size:.85rem;border:1px solid var(--line);border-radius:8px;padding:3px 6px;background:var(--white);color:var(--ink)}
.menu .sw{width:38px;height:22px}
.menu .sw::after{width:16px;height:16px}
.menu .sw[aria-checked="true"]::after{transform:translateX(16px)}
.menu a.mrow:hover,.menu button.mrow:hover{background:var(--bg)}
.menu button.mrow{border:0;background:none;width:100%;text-align:left}
.menu .sep{height:1px;background:var(--line);margin:6px 0}
.adot{position:absolute;top:-2px;right:-2px;width:11px;height:11px;border-radius:50%;background:#E2A400;border:2px solid var(--white)}
.mcomp{margin:2px 4px 8px;padding:12px;border-radius:14px;background:var(--sun)}
.mcomp>b{display:block;font-size:.92rem;color:var(--sun-ink)}
.mcomp>span{display:block;font-size:.8rem;color:var(--sun-ink);margin:2px 0 10px}
.mcomp .mq{font-weight:600;color:var(--ink);font-size:.82rem;margin-bottom:6px}
.mcomp .opts{gap:6px}
.mcomp .opt{padding:5px 11px;font-size:.8rem;background:var(--white)}
.mcurso{display:flex;gap:6px}
.mcurso input{flex:1;min-width:0;font:inherit;font-size:.88rem;border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--white);color:var(--ink)}
.mcurso .pill-btn{padding:7px 12px}
.menu .lbl{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700;padding:6px 12px 2px}

/* ---------- timeline ---------- */
.tl-head{padding-block:40px 18px;display:grid;gap:12px}
.tl-head h1{font-size:clamp(1.9rem,4.8vw,2.6rem);font-weight:800}
.tl-head p{color:var(--gray);max-width:54ch}
.upcoming{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.up{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:center;transition:transform .2s}
.up:hover{transform:translateY(-2px);border-color:var(--green-100)}
.up .d{width:46px;text-align:center;border-radius:12px;background:var(--sun);color:var(--sun-ink);padding:5px 0;line-height:1.1}
.up .d b{display:block;font-size:1.15rem}
.up .d small{font-size:.7rem;font-weight:700;text-transform:uppercase}
.up p{font-size:.88rem;font-weight:600;line-height:1.3}
.up span{font-size:.78rem;color:var(--gray)}
.tl-filters{display:flex;gap:8px;flex-wrap:wrap;position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);z-index:3;background:var(--bg);padding-block:12px}
.chip.lock{color:var(--soft)}
.feed{display:grid;gap:4px;padding-bottom:40px}
.day{font-size:.78rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700;padding:18px 0 8px 64px}
.ev{display:grid;grid-template-columns:48px 16px minmax(0,1fr);gap:0 0;align-items:stretch;animation:rise .35s ease both}
.ev .t{font-size:.78rem;color:var(--soft);text-align:right;padding:18px 10px 0 0;font-variant-numeric:tabular-nums}
.ev .rail{position:relative}
.ev .rail::before{content:"";position:absolute;left:7px;top:0;bottom:0;width:2px;background:var(--line)}
.ev .rail i{position:absolute;left:1px;top:20px;width:14px;height:14px;border-radius:50%;border:3px solid var(--bg)}
.ev .card{margin:6px 0 6px 14px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;transition:box-shadow .2s,border-color .2s}
.ev .card:hover{box-shadow:0 12px 28px -20px rgba(22,32,26,.4);border-color:var(--green-100)}
.ev .kind{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev .kind b{font-size:.78rem;font-weight:700}
.ev h3{font-size:1.05rem;font-weight:700}
.ev p{color:var(--gray);font-size:.9rem}
.ev .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:4px}
.mini{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:5px 12px;font-size:.82rem;font-weight:600;display:inline-flex;gap:6px;align-items:center;transition:all .15s}
.mini:hover{border-color:var(--green)}
.mini.on{background:var(--green-50);border-color:var(--green);color:var(--green-dk)}
.mini svg{width:14px;height:14px}
.k-par{background:var(--green)} .k-pauta{background:#D9A400} .k-vot{background:var(--sky-ink)} .k-lei{background:var(--green-dk)} .k-sub{background:#8A9A10} .k-veto{background:var(--rose-ink)}
.c-par{color:var(--green-dk)} .c-pauta{color:var(--sun-ink)} .c-vot{color:var(--sky-ink)} .c-lei{color:var(--green-dk)} .c-sub{color:var(--lime-ink)} .c-veto{color:var(--rose-ink)}
.tl-empty{padding:30px 0 30px 64px;color:var(--soft)}


/* ---------- compartilhar ---------- */
.share{display:grid;gap:14px}
.share-tabs{display:flex;gap:6px;flex-wrap:wrap}
.stab{border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:6px 13px;font-size:.86rem;font-weight:600;display:inline-flex;gap:7px;align-items:center;color:var(--gray)}
.stab svg{width:15px;height:15px}
.stab[aria-selected="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.preview{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.9rem;line-height:1.55;white-space:pre-wrap;color:#2B342F;max-height:240px;overflow:auto;user-select:all}
.preview.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem}
.ig{width:min(300px,100%);aspect-ratio:1;border-radius:18px;background:var(--green);color:#fff;padding:22px;display:grid;align-content:space-between;justify-self:center}
.ig small{font-size:.72rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.ig h4{margin:0;font-size:1.35rem;line-height:1.15;font-weight:800}
.ig .tg{display:flex;gap:6px;flex-wrap:wrap}
.ig .tg span{background:rgba(255,255,255,.2);border-radius:999px;padding:3px 10px;font-size:.72rem;font-weight:700}
.ig .ft{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;font-weight:600}
.fmt{display:flex;gap:6px;flex-wrap:wrap}
.share-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.share-row span{font-size:.82rem;color:var(--soft)}
.modal.wide{max-width:560px}
.share-btn{display:inline-flex;gap:6px;align-items:center}
.share-btn svg{width:15px;height:15px}

@media (max-width:860px){
  .nav a.opt-hide{display:none}
  .upcoming{grid-template-columns:1fr}
}
@media (max-width:560px){
  .nav{display:none}
  .head .pill-btn{padding:8px 12px;font-size:.84rem}
  .enter{padding:8px 6px}
  .day{padding-left:0}
  .ev{grid-template-columns:16px minmax(0,1fr)}
  .ev .t{display:none}
  .tl-empty{padding-left:0}
}


/* ---------- opinião ---------- */
.pg-head{padding-block:40px 18px;display:grid;gap:12px}
.pg-head h1{font-size:clamp(1.9rem,4.8vw,2.6rem);font-weight:800}
.pg-head p{color:var(--gray);max-width:56ch}
.tally{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.tally-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.tally-h b{font-size:1.05rem}
.tally-h span{font-size:.85rem;color:var(--soft)}
.stack{display:flex;gap:2px;height:14px}
.stack button{border:0;padding:0;height:100%;transition:filter .15s,transform .15s}
.stack button:first-child{border-radius:999px 0 0 999px} .stack button:last-child{border-radius:0 999px 999px 0}
.stack button:hover{filter:brightness(1.08);transform:scaleY(1.25)}
.stack .s-ben{background:var(--pol-pos)} .stack .s-neu{background:var(--pol-mid)} .stack .s-mal{background:var(--pol-neg)} .stack .s-ind{background:repeating-linear-gradient(135deg,var(--pol-ind) 0 6px,#F3C185 6px 9px)}
.tally-leg{display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;color:var(--gray)}
.tally-leg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.tally-leg b{color:var(--ink)}
.feat{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);border-radius:22px;overflow:hidden;background:var(--white);border:1px solid var(--line);transition:box-shadow .2s}
.feat:hover{box-shadow:0 18px 40px -26px rgba(22,32,26,.45)}
.feat .fl{padding:clamp(20px,4vw,30px);display:grid;gap:12px;align-content:start}
.feat .fl small{font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--green-dk)}
.feat h2{font-size:clamp(1.4rem,3.4vw,1.8rem);font-weight:800}
.feat p{color:var(--gray)}
.feat .fr{background:var(--green-50);padding:clamp(20px,4vw,28px);display:grid;gap:14px;align-content:center}
.feat .fr .vline{display:grid;gap:4px}
.feat .fr small{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700}
.feat .fr b{font-size:1.2rem;font-weight:800}
.ops{display:grid;gap:0;background:var(--white);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.op{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 18px;border-bottom:1px solid var(--line);transition:background .15s;animation:rise .3s ease both}
.op:last-child{border-bottom:0}
.op:hover{background:var(--bg)}
.op .dt{text-align:center;line-height:1.1;color:var(--soft);font-size:.75rem;font-weight:700;text-transform:uppercase}
.op .dt b{display:block;font-size:1.35rem;color:var(--ink)}
.op h3{font-size:1.02rem;font-weight:700;margin-bottom:4px}
.op .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.op .min{font-size:.8rem;color:var(--soft)}

/* ---------- artigos ---------- */
.art-feat{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0;border-radius:24px;overflow:hidden;background:var(--white);border:1px solid var(--line);transition:box-shadow .2s}
.art-feat:hover{box-shadow:0 18px 40px -26px rgba(22,32,26,.45)}
.art-feat .txt{padding:clamp(22px,4vw,34px);display:grid;gap:12px;align-content:center}
.art-feat h2{font-size:clamp(1.5rem,3.6vw,2rem);font-weight:800}
.art-feat p{color:var(--gray)}
.cover{min-height:220px;position:relative}
.cv-tend{background:repeating-linear-gradient(135deg,var(--green) 0 14px,var(--green-dk) 14px 28px)}
.cv-dados{background:radial-gradient(circle,var(--sky-ink) 2.5px,transparent 3px) 0 0/16px 16px,var(--sky)}
.cv-expl{background:radial-gradient(circle at 30% 40%,var(--sun) 0 34%,transparent 35%),radial-gradient(circle at 75% 70%,#F7E7A0 0 26%,transparent 27%),var(--cream)}
.cover .cat{position:absolute;left:16px;top:16px;background:var(--white);color:var(--ink);font-size:.75rem;font-weight:700;padding:4px 10px;border-radius:999px}
.byline{display:flex;gap:10px;align-items:center;font-size:.85rem;color:var(--gray)}
.byline .av{width:30px;height:30px;font-size:.72rem}
.arts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.art{background:var(--white);border:1px solid var(--line);border-radius:20px;overflow:hidden;display:grid;grid-template-rows:120px auto;transition:transform .2s,box-shadow .2s;animation:rise .3s ease both}
.art:hover{transform:translateY(-3px);box-shadow:0 16px 34px -24px rgba(22,32,26,.45)}
.art .cover{min-height:0}
.art .in{padding:16px 18px;display:grid;gap:8px;align-content:start}
.art h3{font-size:1.08rem;font-weight:700}
.art p{color:var(--gray);font-size:.9rem}
.art .min{font-size:.8rem;color:var(--soft)}
.news{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--green-50);border-radius:20px;padding:20px 22px;margin-block:20px 60px}
.news b{font-size:1.1rem}
.news p{color:var(--gray);font-size:.92rem}

/* ---------- leitura de artigo ---------- */
.reader{max-width:680px;margin:0 auto;padding-inline:20px;padding-block:8px 70px;display:grid;gap:22px}
.reader .cover{min-height:200px;border-radius:22px}
.reader h1{font-size:clamp(1.9rem,5vw,2.7rem);font-weight:800}
.reader .dek{font-size:1.15rem;color:var(--gray);line-height:1.5}
.body{display:grid;gap:18px;font-size:1.06rem;line-height:1.7;color:#27302B}
.body h2{font-size:1.3rem;font-weight:700;margin-top:8px}
.pull{border-left:4px solid var(--green);padding:4px 0 4px 18px;font-size:1.3rem;font-weight:700;line-height:1.35;color:var(--ink)}
.fig{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:10px}
.fig small{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700}
.hbar{display:grid;grid-template-columns:110px minmax(0,1fr) 42px;gap:10px;align-items:center;font-size:.9rem}
.hbar .tr{height:14px;background:var(--bg);border-radius:0 4px 4px 0}
.hbar .tr span{display:block;height:100%;background:var(--green-dk);border-radius:0 4px 4px 0}
.hbar b{font-variant-numeric:tabular-nums;text-align:right}
.reader .art .cover{min-height:0;border-radius:0}
.brand,.head .pill-btn{white-space:nowrap}
.cited{display:grid;gap:8px}
.cited a{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .15s}
.cited a:hover{border-color:var(--green)}
.cited a span{font-size:.82rem;color:var(--soft)}

@media (max-width:760px){
  .feat,.art-feat,.arts{grid-template-columns:1fr}
  .art-feat .cover{min-height:150px;order:-1}
  .op{grid-template-columns:48px minmax(0,1fr)}
  .op > .arrow{display:none}
}


/* ---------- leis estaduais ---------- */
.uf-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:28px;align-items:start}
.tilemap{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(8,1fr);gap:5px;aspect-ratio:6/8;max-width:360px;width:100%}
.uf{border:0;border-radius:9px;font-size:.8rem;font-weight:700;display:grid;place-items:center;line-height:1;transition:transform .15s,box-shadow .15s;position:relative}
.uf small{display:block;font-size:.64rem;font-weight:600;margin-top:2px;opacity:.85}
.uf:hover{transform:scale(1.08);z-index:1}
.uf[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink);z-index:2}
.uf.n0{background:var(--green-50);color:var(--green-dk)}
.uf.n1{background:#7FCB9D;color:#0F3A22}
.uf.n2{background:var(--green-dk);color:#fff}
.uf.breve{background:repeating-linear-gradient(135deg,var(--white) 0 5px,var(--line) 5px 7px);color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.uf.breve[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ink)}
.maplegend{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:.8rem;color:var(--gray);margin-top:12px}
.maplegend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.ufpanel{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:14px;animation:rise .25s ease both}
.ufpanel h2{font-size:1.5rem;font-weight:800}
.ufpanel .casa{color:var(--gray);font-size:.9rem;margin-top:-8px}
.ufstats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ufstats div{background:var(--bg);border-radius:12px;padding:10px 12px;display:grid;gap:2px}
.ufstats b{font-size:1.4rem;font-weight:800;font-variant-numeric:tabular-nums}
.ufstats span{font-size:.78rem;color:var(--gray)}
.cov{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--gray);background:var(--bg);border-radius:12px;padding:10px 12px}
.cov b{color:var(--ink)}
.minilist{display:grid;gap:8px}
.minilaw{display:grid;gap:4px;border:1px solid var(--line);border-radius:14px;padding:12px 14px;transition:border-color .15s}
.minilaw:hover{border-color:var(--green)}
.minilaw b{font-size:.98rem}
.minilaw .row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.minilaw .row span.n{font-size:.8rem;color:var(--soft)}
.ask{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--line);padding-top:12px;font-size:.88rem;color:var(--gray)}

/* ---------- leis federais ---------- */
.seg{display:inline-flex;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:999px;padding:7px 14px;font-weight:600;font-size:.88rem;color:var(--gray)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.funnel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.stage{border:0;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:12px 10px;display:grid;gap:6px;text-align:left;position:relative;transition:all .15s}
.stage:hover{border-color:var(--green)}
.stage[aria-pressed="true"]{background:var(--green-50);border-color:var(--green)}
.stage b{font-size:1.6rem;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.stage span{font-size:.8rem;color:var(--gray);font-weight:600}
.stage .bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.stage .bar i{display:block;height:100%;background:var(--green-dk);border-radius:999px}
.agenda{display:grid;gap:8px}
.agenda a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--white);border:1px solid var(--line);border-radius:14px;padding:10px 14px;transition:border-color .15s}
.agenda a:hover{border-color:var(--green)}
.agenda .d{background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:4px 10px;font-weight:700;font-size:.85rem;white-space:nowrap}
.agenda p{font-weight:600;font-size:.93rem}
.agenda span.o{font-size:.8rem;color:var(--gray)}

@media (max-width:760px){
  .uf-layout{grid-template-columns:1fr}
  .tilemap{margin:0 auto}
  .funnel{grid-template-columns:repeat(2,minmax(0,1fr))}
  .agenda a{grid-template-columns:auto minmax(0,1fr)}
  .agenda a .arrow{display:none}
}


/* ---------- inscrição: perfil em cartões, imprensa ---------- */
.pcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pcard{display:grid;grid-template-columns:minmax(0,1fr) 20px;gap:2px 10px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--white);border-radius:14px;padding:11px 14px;transition:border-color .15s,background .15s}
.pcard b{font-size:.95rem}
.pcard span{grid-column:1;font-size:.8rem;color:var(--gray)}
.pcard i{grid-row:1/3;grid-column:2;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:block}
.pcard[aria-checked="true"]{border-color:var(--green);background:var(--green-50)}
.pcard[aria-checked="true"] i{border:6px solid var(--green)}
.pcard .press{color:var(--sky-ink);font-weight:600}
.pdet{margin-top:14px;padding:14px;border-radius:14px;background:var(--bg);border:1px solid var(--line)}
.pdet:empty{display:none}
.pdet .field+.field{margin-top:12px}
.pdet-q{display:block;font-weight:600;font-size:.9rem;margin-bottom:8px}
.pdet-note{margin-top:12px;font-size:.86rem;color:var(--sky-ink)}
.pressbox{background:var(--sky);border-radius:14px;padding:14px 16px;display:grid;gap:8px}
.pressbox b{color:var(--sky-ink)}
.pressbox ul{margin:0;padding-left:18px;display:grid;gap:3px;font-size:.88rem;color:#2B3A55}
.hint{font-size:.8rem;color:var(--soft);font-weight:400}
.field .req{color:var(--rose-ink)}
.statuscard{display:grid;gap:6px;background:var(--sky);border-radius:14px;padding:14px 16px;text-align:left;width:100%}
.statuscard b{color:var(--sky-ink)}
.statuscard span{font-size:.88rem;color:#2B3A55}
.linkbtn{background:none;border:0;padding:0;color:var(--gray);font-size:.82rem;text-decoration:underline}
.avatar{position:relative}
.avatar.press::after{content:"✓";position:absolute;right:-3px;bottom:-3px;width:16px;height:16px;border-radius:50%;background:var(--sky-ink);color:#fff;font-size:.6rem;display:grid;place-items:center;border:2px solid var(--white)}
.pchip{font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sky);color:var(--sky-ink)}

/* ---------- inscrição no celular ---------- */
.mflow{display:flex;flex-direction:column;min-height:0;background:var(--bg);color:var(--ink)}
.mflow.full{min-height:100vh;min-height:100dvh}
.mtop{display:grid;grid-template-columns:40px minmax(0,1fr) 40px;align-items:center;gap:12px;padding:12px 16px;background:var(--bg);position:sticky;top:0;z-index:2}
.mx{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--white);font-size:1.05rem;display:grid;place-items:center}
.mprog{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.mprog span{display:block;height:100%;background:var(--green);border-radius:999px;transition:width .35s ease}
.mcount{font-size:.78rem;color:var(--soft);font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.mbody{padding:6px 20px 24px;display:grid;gap:16px;align-content:start;flex:1}
.mbody h2{font-size:1.55rem;font-weight:800;line-height:1.15}
.mbody .lead{color:var(--gray);font-size:.95rem;margin-top:-6px}
.mbody .field input,.mbody .field select{font-size:16px;padding:14px;border-radius:14px}
.mbody .pcards{grid-template-columns:1fr}
.mbody .pcard{padding:14px 16px}
.mperks{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-20px;padding:2px 20px 6px;scrollbar-width:none}
.mperks::-webkit-scrollbar{display:none}
.mperk{flex:0 0 78%;scroll-snap-align:start;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:start}
.mperk .pi{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--green-50);color:var(--green-dk)}
.mperk .pi svg{width:20px;height:20px}
.mperk b{display:block;font-size:.95rem}
.mperk span{font-size:.84rem;color:var(--gray)}
.mbrand{display:flex;align-items:center;gap:8px;font-weight:800}
.mfoot{padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));background:var(--white);border-top:1px solid var(--line);display:grid;gap:6px;position:sticky;bottom:0;z-index:2}
.pill-btn.block{width:100%;padding:15px;font-size:1rem}
.mfoot small{text-align:center;color:var(--soft);font-size:.78rem}
body.focus .head,body.focus .foot{display:none}

/* moldura de celular (visualização no computador) */
.phone-page{display:grid;grid-template-columns:auto minmax(0,1fr);gap:56px;align-items:start;padding-block:36px 70px}
.phone{width:380px;height:790px;border-radius:52px;background:#141A17;padding:12px;box-shadow:0 40px 80px -40px rgba(22,32,26,.6),inset 0 0 0 2px #2A332F;position:relative}
.phone .notch{position:absolute;top:24px;left:50%;transform:translateX(-50%);width:108px;height:30px;border-radius:20px;background:#141A17;z-index:6}
.phone .screen{height:100%;border-radius:40px;overflow:hidden;background:var(--bg);display:flex;flex-direction:column}
.phone .pstat{height:50px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:6px 28px 0;font-size:.8rem;font-weight:700;background:var(--bg)}
.phone .mflow{flex:1;min-height:0}
.phone .mbody{overflow-y:auto}
.phone .mfoot{position:static}
.phone .mtop{position:static}
.notes{display:grid;gap:20px;max-width:420px}
.notes h1{font-size:clamp(1.8rem,4vw,2.4rem);font-weight:800}
.notes > p{color:var(--gray)}
.notes ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.notes li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:.95rem}
.notes li i{width:28px;height:28px;border-radius:9px;background:var(--green-50);color:var(--green-dk);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.85rem}
.notes .row{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- padrão de atuação e panorama ---------- */
.atu{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px 20px;display:grid;gap:14px}
.atu-h{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.atu-h h3{font-size:1.1rem;font-weight:700}
.atu-h small{display:block;color:var(--soft);font-size:.82rem;font-weight:500;margin-top:2px}
.trend{font-size:.8rem;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;background:none!important;padding:0}
.trend::before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor;opacity:.8}
.tr-pos{background:var(--green-50);color:#1F7A4D} .tr-neg{background:#FCEADF;color:#9A4A16} .tg-ind{background:#FCEFD9;color:#8A5A12} .tr-eq{background:var(--neutral-soft,#EEF1EF);color:var(--gray)} .tr-low{color:var(--soft)}
.srow{display:grid;grid-template-columns:190px minmax(0,1fr);gap:12px;align-items:center;font-size:.88rem}
.srow > span{color:var(--gray)}
.srow > span b{color:var(--ink);font-weight:600}
.sb{display:grid;gap:6px;min-width:0}
.sbar{display:flex;gap:2px;height:10px}
.sbar i{display:block;font-style:normal;font-size:0;min-width:0;overflow:hidden;white-space:nowrap;transition:filter .15s}
.sbar i:first-child{border-radius:999px 0 0 999px} .sbar i:last-child{border-radius:0 999px 999px 0} .sbar i:only-child{border-radius:999px}
.svals{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:.76rem;color:var(--gray);font-variant-numeric:tabular-nums}
.svals span{display:inline-flex;align-items:center;gap:5px}
.svals i{width:7px;height:7px;border-radius:50%;display:inline-block}
.svals .m{background:var(--pol-neg)} .svals .i{background:var(--pol-ind)} .svals .n{background:var(--pol-mid)} .svals .b{background:var(--pol-pos)}
.sbar i:hover{filter:brightness(1.07)}
.sbar .m{background:var(--pol-neg);color:#fff} .sbar .i{background:repeating-linear-gradient(135deg,var(--pol-ind) 0 4px,#F3C185 4px 6px)} .sbar .n{background:var(--pol-mid);color:var(--ink)} .sbar .b{background:var(--pol-pos);color:#fff}
.sbar.sm{height:7px}
.nodata{font-size:.85rem;color:var(--soft);height:24px;display:flex;align-items:center}
.plegend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.82rem;color:var(--gray)}
.plegend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.themes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.84rem;color:var(--gray)}
.themes span.t{background:var(--bg);border-radius:999px;padding:3px 10px;color:var(--ink);font-weight:500}
.method{font-size:.78rem;color:var(--soft);line-height:1.45}
.atu-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.gtip{position:fixed;z-index:40;background:var(--ink);color:#fff;font-size:.8rem;padding:7px 10px;border-radius:8px;pointer-events:none;white-space:nowrap}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.kpi{background:none;border:0;border-top:1px solid var(--line);border-radius:0;padding:12px 2px 4px;display:grid;gap:2px}
.kpi b{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi span{font-size:.82rem;color:var(--gray)}
.ptabs{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:22px}
.prows{display:grid;gap:0}
.pgroup{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700;padding:14px 0 6px}
.prow{display:grid;grid-template-columns:minmax(0,220px) minmax(0,1fr) 150px;gap:18px;align-items:center;padding:12px 10px;border-radius:12px;background:none;border-bottom:1px solid var(--line);transition:background .15s}
.prow:hover{background:var(--white)}
.prow .nm{display:flex;gap:10px;align-items:center;min-width:0}
.prow .nm b{display:block;font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .nm small{display:block;font-size:.78rem;color:var(--soft)}
.prow .trend{justify-self:end}
.ptable{width:100%;border-collapse:collapse;font-size:.88rem;background:var(--white);border-radius:14px;overflow:hidden}
.ptable th,.ptable td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.ptable th{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);background:var(--bg)}
.ptable td.r,.ptable th.r{text-align:right}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.bcard{border:1px solid var(--line);background:var(--white);border-radius:18px;padding:14px 16px;display:grid;gap:8px;text-align:left;transition:border-color .15s,transform .15s}
.bcard:hover{transform:translateY(-2px)}
.bcard[aria-pressed="true"]{border-color:var(--green);background:var(--green-50)}
.bcard h3{font-size:1.05rem;font-weight:700}
.bcard small{font-size:.8rem;color:var(--gray)}
.bcard .fx{display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 8px;font-size:.8rem;color:var(--gray)}
.bcard .fx span{white-space:nowrap}
.bdetail{background:var(--white);border:1px solid var(--line);border-radius:20px;padding:20px;display:grid;gap:16px;margin-top:12px;animation:rise .25s ease both}
.bdetail h3{font-size:1.35rem;font-weight:800}
.qual{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.qual div{border-radius:14px;padding:14px 16px;display:grid;gap:6px}
.qual .q-neg{background:#FCEADF} .qual .q-pos{background:var(--green-50)}
.qual b{font-size:.82rem;letter-spacing:.05em;text-transform:uppercase}
.qual .q-neg b{color:#9A4A16} .qual .q-pos b{color:#1F7A4D}
.qual ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
.arows{display:grid;gap:0}
.arow{display:grid;grid-template-columns:170px 150px minmax(0,1fr) 28px;gap:18px;align-items:center;padding:12px 10px;border-radius:12px;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;width:100%;transition:background .15s}
.arow:hover{background:var(--white)}
.arow b{font-size:.93rem}
.mag{display:grid;grid-template-columns:minmax(0,1fr) 28px;gap:6px;align-items:center;font-size:.84rem;font-variant-numeric:tabular-nums}
.mag span.tr{height:6px;background:var(--bg);border-radius:0 4px 4px 0}
.mag span.tr i{display:block;height:100%;background:var(--green-100);border-radius:0 4px 4px 0}
.arow .chev{color:var(--soft);transition:transform .2s;justify-self:end}
.arow[aria-expanded="true"]{background:var(--white)}
.arow[aria-expanded="true"] .chev{transform:rotate(90deg)}
.anote{margin:-2px 0 6px;padding:10px 14px 12px 196px;font-size:.9rem;color:#3A443E}
.pano-teaser{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--white);border:1px solid var(--line);border-radius:20px;padding:18px 20px}
.pano-teaser p{color:var(--gray);font-size:.92rem}
.pano-teaser .sb{width:220px;max-width:100%}

@media (max-width:900px){
  .nav{overflow-x:auto;scrollbar-width:none;min-width:0;flex:1 1 auto;margin-right:0}
  .nav::-webkit-scrollbar{display:none}
  .phone-page{grid-template-columns:1fr;justify-items:center}
}
@media (max-width:760px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .prow{grid-template-columns:minmax(0,1fr) auto;gap:10px}
  .prow .sb,.prow .nodata{grid-column:1/-1;grid-row:2}
  .prow .trend{grid-row:1;grid-column:2;align-self:start}
  .srow{grid-template-columns:1fr}
  .arow{grid-template-columns:minmax(0,1fr) 28px}
  .arow .mag,.arow .sb{grid-column:1/-1}
  .anote{padding-left:14px}
  .qual,.pcards{grid-template-columns:1fr}
}


/* ---------- parlamentar ---------- */
.parl-head{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:center;padding-block:22px 10px}
.portrait{width:96px;height:96px;border-radius:28px;background:linear-gradient(160deg,var(--green-50),var(--green-100));color:var(--green-dk);display:grid;place-items:center;font-size:1.9rem;font-weight:800;position:relative}
.portrait .flag{position:absolute;right:-6px;bottom:-6px;width:30px;height:20px;border-radius:4px;box-shadow:0 0 0 3px var(--bg)}
.parl-head h1{font-size:clamp(1.7rem,4.4vw,2.4rem);font-weight:800}
.parl-head .meta{margin-top:6px}
.parl-acts{display:flex;gap:8px;flex-wrap:wrap}
.pstats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:8px}
.ptabs2{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-top:26px;overflow-x:auto}
.ptabs2 button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--gray);border-bottom:2px solid transparent;white-space:nowrap}
.ptabs2 button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--green)}
.vote-sum{display:grid;gap:10px}
.vote-sum p{font-size:1.02rem}
.vrows{display:grid}
.vrow{display:grid;grid-template-columns:64px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line)}
.vrow .dt{font-size:.8rem;color:var(--soft);font-variant-numeric:tabular-nums}
.vrow b{font-size:.95rem;display:block}
.vrow small{font-size:.8rem;color:var(--soft)}
.vchip{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:8px;white-space:nowrap}
.v-sim{background:#E7EEF9;color:#2C5AA0} .v-nao{background:#F3E8F7;color:#6B3A86} .v-aus{background:var(--bg);color:var(--soft);box-shadow:inset 0 0 0 1px var(--line)}
.sentido{font-size:.76rem;font-weight:600;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.sentido::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-pro{color:#1F7A4D} .s-contra{color:#9A4A16} .s-na{color:var(--soft)}
.comm{display:flex;flex-wrap:wrap;gap:6px}
.comm span{font-size:.84rem;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.plist{display:grid}
.plist a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:12px;transition:background .15s}
.plist a:hover{background:var(--white)}
.plist .av{width:40px;height:40px;font-size:.8rem}
.plist b{display:block}
.plist small{color:var(--soft);font-size:.8rem}
.person{text-decoration:none;color:inherit;transition:background .15s}
a.person:hover{background:var(--green-50)}
a.person .go-c{margin-left:auto;width:28px;height:28px}
.emenda a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
@media (max-width:760px){
  .parl-head{grid-template-columns:auto minmax(0,1fr)}
  .parl-acts{grid-column:1/-1}
  .pstats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vrow{grid-template-columns:minmax(0,1fr) auto}
  .vrow .dt{grid-column:1/-1}
  .vrow .sentido{grid-column:1/-1}
}


/* ---------- parlamentares estaduais ---------- */
.ufpick{display:flex;gap:8px;flex-wrap:wrap}
.ufbtn{display:inline-flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--white);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;font-size:.88rem}
.ufbtn[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:#fff}
.srcnote{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;font-size:.88rem;color:var(--gray)}
.srcnote b{color:var(--ink)}
.srcnote .ico{width:22px;height:22px;color:var(--green-dk)}
.dlist{display:grid}
.drow2{display:grid;grid-template-columns:auto minmax(0,1fr) minmax(0,200px) auto;gap:16px;align-items:center;padding:12px 8px;border-bottom:1px solid var(--line);border-radius:12px;transition:background .15s}
.drow2:hover{background:var(--white)}
.drow2 .av{width:42px;height:42px;font-size:.8rem}
.drow2 b{display:block}
.drow2 small{color:var(--soft);font-size:.8rem}
.others{display:flex;flex-wrap:wrap;gap:6px}
.others span{font-size:.84rem;background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--gray)}
.search.slim{padding:4px 4px 4px 14px;box-shadow:none}
.datanote{font-size:.85rem;color:var(--gray);background:var(--bg);border-radius:12px;padding:10px 14px}
@media (max-width:760px){
  .drow2{grid-template-columns:auto minmax(0,1fr) auto}
  .drow2 .sbar,.drow2 .hint{grid-column:2;grid-row:2}
  .drow2 .go-c{grid-column:3;grid-row:1}
}


/* ---------- metodologia ---------- */
.flow{list-style:none;margin:0;padding:0;display:grid;gap:0;counter-reset:f}
.flow li{counter-increment:f;display:grid;grid-template-columns:44px minmax(0,1fr);gap:14px;position:relative;padding-bottom:20px}
.flow li::before{content:counter(f);width:36px;height:36px;border-radius:50%;background:var(--green-50);color:var(--green-dk);display:grid;place-items:center;font-weight:800;font-size:.95rem;z-index:1}
.flow li::after{content:"";position:absolute;left:17px;top:38px;bottom:2px;width:2px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow b{display:block;font-size:1.02rem;margin-top:6px}
.flow p{color:var(--gray);font-size:.93rem;margin-top:2px}
.flow .who{display:inline-block;margin-top:6px;font-size:.74rem;font-weight:700;padding:2px 8px;border-radius:999px}
.who.h{background:var(--green-50);color:var(--green-dk)} .who.m{background:var(--sky);color:var(--sky-ink)} .who.hm{background:var(--sun);color:var(--sun-ink)}
.cscale{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.cbox{border:1px solid var(--line);background:var(--white);border-radius:16px;padding:14px;display:grid;gap:8px;text-align:left;align-content:start;transition:border-color .15s}
.cbox[aria-pressed="true"]{border-color:var(--ink)}
.cbox .sw2{height:8px;border-radius:999px}
.cbox b{font-size:.98rem}
.cbox span{font-size:.84rem;color:var(--gray)}
.cex{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;margin-top:8px}
.cex small{font-size:.74rem;letter-spacing:.07em;text-transform:uppercase;color:var(--soft);font-weight:700}
.crit{width:100%;border-collapse:collapse;font-size:.9rem;background:var(--white);border-radius:14px;overflow:hidden}
.crit th,.crit td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.crit th{font-size:.74rem;letter-spacing:.05em;text-transform:uppercase;color:var(--soft);background:var(--bg)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.rule{background:var(--white);border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.rule b{font-size:.95rem}
.rule p{font-size:.88rem;color:var(--gray)}
.rule code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.8rem;background:var(--bg);border-radius:6px;padding:2px 6px;color:var(--ink)}
.iacols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.iacols div{border-radius:16px;padding:14px 16px;display:grid;gap:6px;align-content:start}
.iacols .yes{background:var(--green-50)} .iacols .no{background:#FCEADF}
.iacols b{font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.iacols .yes b{color:#1F7A4D} .iacols .no b{color:#9A4A16}
.iacols ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
.limits{display:grid;gap:8px}
.limits div{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px;font-size:.93rem}
.limits .ico{width:20px;height:20px;color:var(--green-dk);margin-top:2px}
.fixlog{display:grid}
.fixlog div{display:grid;grid-template-columns:70px minmax(0,1fr);gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.9rem}
.fixlog span{color:var(--soft);font-variant-numeric:tabular-nums}
.fixlog a{text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.faq details{border-bottom:1px solid var(--line);padding:12px 2px}
.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:10px}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .2s;color:var(--soft)}
.faq details[open] summary .ico{transform:rotate(90deg)}
.faq p{color:var(--gray);font-size:.93rem;margin-top:8px;max-width:66ch}
.metod-link{font-size:.85rem;color:var(--gray);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
@media (max-width:760px){ .cscale,.rules,.iacols{grid-template-columns:1fr 1fr} }
@media (max-width:480px){ .cscale,.rules,.iacols{grid-template-columns:1fr} }


/* ---------- autor ---------- */
.photo{border-radius:50%;background:linear-gradient(150deg,#DCEFE4,#B9DCC8);color:var(--green-dk);display:grid;place-items:center;font-weight:800;flex:none;position:relative;overflow:hidden}
.photo::after{content:"";position:absolute;inset:auto 0 0 0;height:38%;background:radial-gradient(60% 100% at 50% 100%,rgba(31,122,77,.18),transparent)}
.photo.sm{width:40px;height:40px;font-size:.8rem}
.photo.md{width:72px;height:72px;font-size:1.3rem}
.photo.lg{width:112px;height:112px;font-size:2rem}
.byauthor{display:flex;align-items:center;gap:12px}
.byauthor a{font-weight:700;color:var(--ink)}
.byauthor small{display:block;color:var(--gray);font-size:.84rem}
.msoc{display:inline-flex;gap:2px;margin-left:8px;vertical-align:-3px}
.msoc a{width:22px;height:22px;display:grid;place-items:center;border-radius:6px;color:var(--soft);font-weight:400!important;transition:color .15s,background .15s}
.msoc a:hover{color:var(--green-dk);background:var(--green-50)}
.msoc svg{width:14px;height:14px}
.abox{display:grid;grid-template-columns:auto minmax(0,1fr);gap:18px;align-items:start;background:var(--white);border:1px solid var(--line);border-radius:22px;padding:20px 22px;margin:6px 0 26px}
.abox .eyebrow{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:700}
.abox h3{font-size:1.2rem;font-weight:800;margin-top:2px}
.abox .tit{color:var(--green-dk);font-weight:600;font-size:.92rem}
.abox p{color:var(--gray);font-size:.92rem;margin-top:6px;max-width:62ch}
.socials{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.soc{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--white);display:grid;place-items:center;color:var(--ink);transition:all .15s}
.soc:hover{border-color:var(--green);color:var(--green-dk)}
.soc svg{width:17px;height:17px}
.subjects{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.85rem;color:var(--gray);margin-bottom:22px}
.subjects a{background:var(--white);border:1px solid var(--line);border-radius:999px;padding:4px 12px;color:var(--ink)}
.subjects a:hover{border-color:var(--green)}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.86rem;color:var(--soft)}
.crumbs a{color:var(--gray)}
.crumbs a:hover{color:var(--ink)}
.crumbs .ico{width:14px;height:14px}
.auth-head{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center;padding-block:26px 8px}
.auth-head h1{font-size:clamp(1.8rem,4.5vw,2.5rem);font-weight:800}
@media (max-width:560px){ .abox{grid-template-columns:1fr} .auth-head{grid-template-columns:1fr} }


/* ---------- temas e biomas ---------- */
.tb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.tbc{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:8px;align-content:start;transition:border-color .15s,transform .15s}
.tbc:hover{border-color:var(--green);transform:translateY(-2px)}
.tbc h3{font-size:1.05rem;font-weight:700}
.tbc small{color:var(--gray);font-size:.82rem}
.tbc .fx{display:flex;justify-content:space-between;gap:8px;font-size:.8rem;color:var(--soft)}
.tbc.bio{background:linear-gradient(180deg,var(--white),var(--bg))}
.tb-head{display:grid;gap:12px;padding-block:14px 8px;max-width:760px}
.tb-head h1{font-size:clamp(2rem,5vw,2.8rem);font-weight:800}
.tb-head .intro{font-size:1.08rem;color:#3A443E;line-height:1.6}
.tb-head .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.ufchips{display:flex;flex-wrap:wrap;gap:6px}
.ufchips a,.ufchips span{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--white);border-radius:999px;padding:4px 12px 4px 6px;font-size:.84rem}
.ufchips span{color:var(--soft)}
.ufchips span .flag{opacity:.45;filter:grayscale(.4)}
.ufchips a:hover{border-color:var(--green)}
.biochips{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.biochips a{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:500}
.biochips a:hover{border-color:var(--green)}


/* ---------- home: explore ---------- */
.tgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tcard{display:grid;grid-template-columns:44px minmax(0,1fr);gap:12px;align-items:start;background:var(--white);border:1px solid var(--line);border-radius:18px;padding:16px;transition:border-color .2s,transform .2s,box-shadow .2s}
.tcard:hover{border-color:var(--green-100);transform:translateY(-2px);box-shadow:0 14px 30px -22px rgba(22,32,26,.45)}
.tico{width:44px;height:44px;border-radius:14px;background:var(--green-50);color:var(--green-dk);display:grid;place-items:center;transition:background .2s,color .2s}
.tico svg{width:24px;height:24px}
.tcard:hover .tico{background:var(--green);color:#fff}
.tcard b{display:block;font-size:1rem}
.tcard div span{display:block;font-size:.84rem;color:var(--gray);margin-top:1px}
.tcard small{display:block;font-size:.76rem;color:var(--soft);margin-top:6px}
.hints{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;font-size:.85rem;color:var(--soft)}
.hints a{color:var(--gray);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
.hints a:hover{color:var(--ink)}
.seg.sm button{padding:5px 11px;font-size:.82rem}
.agenda .o{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.agenda .o .tag{font-size:.7rem}
.section-h{flex-wrap:wrap}
.section-h h2{white-space:nowrap}
@media (max-width:420px){ .tgrid{grid-template-columns:1fr} }

@media (max-width:640px){
  .topics{grid-template-columns:repeat(2,minmax(0,1fr))}

  .quick,.files,.modal .row,.people{grid-template-columns:1fr}
  .party{grid-template-columns:minmax(0,1fr) 80px}

}

const flag = (uf,cls="") => uf&&FLAGS[uf] ? `<img class="flag ${cls}" src="${FLAGS[uf]}" alt="" aria-hidden="true">` : "";
const placeTag = local => `<span class="tag tg-place">${flag(flagOf(local))}${local}</span>`;
const ARR='<svg class="ico ico-r" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15"/><path d="M13.5 6.5L19 12l-5.5 5.5"/></svg>';

const $ = s => document.querySelector(s);

function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
const stTag = s => `<span class="tag dot ${s==="Aprovada"?"tg-apr":"tg-tram"}">${s}</span>`;
const carTag = c => `<span class="tag ${c==="Maléfico"?"tg-mal":c==="Enfraquece indiretamente"?"tg-ind":c==="Neutro"?"tg-neu":"tg-ben"}">${c}</span>`;

function filtradas(){
  const q = state.q.trim().toLowerCase();
  return LEIS.filter(l =>
    (state.topic==="todos"||state.topic==="artigos"||(state.topic==="parecer"?l.parecer:l.esfera===state.topic)) &&
    (state.status==="Todas"||l.status===state.status) &&
    (!q || (l.titulo+l.resumo+l.local+l.num).toLowerCase().includes(q)));
}
function listHTML(){
  const ls = filtradas();
  if(!ls.length) return `<p class="empty">Nada encontrado com esses filtros. Tente outro termo ou estado.</p>`;
  return ls.slice(0,6).map((l,i)=>`<a class="law" href="#${l.id}" style="animation-delay:${i*40}ms">
    <div class="top">${placeTag(l.local)}${stTag(l.status)}</div>
    <h3>${l.titulo}</h3><p>${l.resumo}</p>
    <div class="go"><span class="num">${l.num}</span><span class="arrow">${l.parecer?"Ler parecer":"Parecer em breve"}${ARR}</span></div></a>`).join("");
}

function factsSentence(l){
  const a=atores(l), ne=a.emendas.length;
  if(/^Decreto/.test(l.num)) return `O ${l.num} foi editado pela Presidência da República e já está em vigor. Decretos não passam por votação no Congresso.`;
  const casa = l.esfera==="federal" ? "no Congresso Nacional" : "na Assembleia Legislativa "+deUF(UF_NOME_R[l.local]);
  const inicio = l.status==="Aprovada" ? `A ${l.num} foi aprovada ${casa} e sancionada` : `O ${l.num} tramita ${casa}`;
  const vot = a.orgao ? ` Na última votação, em ${a.data}, ${a.orgao} aprovou o texto por ${a.sim} a ${a.nao}.` : (l.status==="Aprovada"?"":" Ainda não houve votação.");
  const em = ne ? ` ${ne===1?"Foi apresentada 1 emenda.":"Foram apresentadas "+ne+" emendas."}` : (l.status==="Aprovada"?"":" Nenhuma emenda foi apresentada até agora.");
  const ETAPA_TXT={"Apresentado":"aguarda distribuição às comissões","Comissões":"está em análise nas comissões","Plenário":"está pronto para votação em plenário","Outra casa":"já passou pela casa de origem e está em análise na outra casa"};
  const sit = l.status!=="Aprovada" ? ` Hoje ${ETAPA_TXT[l.etapa]||"está em tramitação"}.` : "";
  const vf = (typeof VOTADO_EM!=="undefined" && VOTADO_EM[l.id]) ? VOTADO_EM[l.id].map(v=>v[1]).join(" e ") : "";
  const vot2 = a.orgao ? vot : vf ? ` Já houve votação em: ${vf}.` : vot;
  return `${inicio}; a autoria é de ${a.autor[0]} (${a.autor[1]}).${sit}${vot2}${em}`;
}

function inscricao(){

function mobileSignup(full){
  const S=stepsInsc(), id=S[insc.i], last=insc.i===S.length-1;
  const pct = insc.ok ? 100 : Math.round(insc.i/S.length*100)+8;
  let body, foot;
  if(insc.ok){
    body=`<div class="done-card" style="padding-top:30px">${doneBody()}</div>`;
    foot=`<a class="pill-btn block" href="#home" style="text-align:center">Explorar as leis</a>`;
  } else {
    const intro = id==="voce" ? `<div class="mbrand" role="img" aria-label="ênfase jur"><i></i></div>
      <h2>Leis ambientais explicadas antes da votação</h2><p class="lead">Grátis, sem senha. O parecer é aberto a todos; inscritos recebem o aprofundamento e os alertas.</p>
      <div class="mperks" aria-label="Benefícios">${PERKS.map(k=>`<div class="mperk"><span class="pi">${PERK_ICON[k[0]]}</span><div><b>${k[1]}</b><span>${k[2]}</span></div></div>`).join("")}</div>` 
      : `<h2>${STEP_TXT[id][0]}</h2><p class="lead">${STEP_TXT[id][1]}</p>`;
    body = intro + stepBody(id);
    foot=`<button class="pill-btn block" data-act="${last?"finish":"next"}">${last?"Criar inscrição":"Continuar"}</button><small>${id==="imprensa"?"Verificação em até 2 dias úteis":"Grátis · sem senha · cancele quando quiser"}</small>`;
  }
  return `<div class="mflow ${full?"full":""}">
    <div class="mtop"><button class="mx" data-act="${insc.i&&!insc.ok?"prev":"m-close"}" aria-label="${insc.i&&!insc.ok?"Voltar":"Fechar"}">${insc.i&&!insc.ok?ARL:"✕"}</button>
      <div class="mprog" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${Math.min(pct,100)}%"></span></div>
      <span class="mcount">${insc.ok?"✓":(insc.i+1)+"/"+S.length}</span></div>
    <div class="mbody" id="mbody">${body}</div>
    <div class="mfoot">${foot}</div></div>`;
}

function validaPasso(){
  const id=stepsInsc()[insc.i];
  if(id==="voce" && (!insc.nome || !/^\S+@\S+\.\S+$/.test(insc.email))) return "Preencha seu nome e um e-mail válido";
  if(id==="perfil" && !insc.perfil) return "Escolha o que melhor descreve você";
  if(id==="perfil" && insc.perfil==="Estudante" && !insc.curso) return "Informe o seu curso";
  if(id==="perfil" && PERFIL_SUB[insc.perfil] && !insc.sub) return PERFIL_Q[insc.perfil].replace("?","")+": escolha uma opção";
  if(id==="imprensa"){ const m=insc.imp; if(!m.veiculo) return "Informe o veículo em que você trabalha"; if(!/^(https?:\/\/)?\S+\.\S+/.test(m.link)) return "Informe um link de comprovação"; if(!m.aut) return "Autorize a verificação para continuar"; }

function sbar(p,n,small){
  if(!n) return `<span class="nodata">Nenhum parecer no período</span>`;
