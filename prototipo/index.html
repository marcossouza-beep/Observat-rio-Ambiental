<title>Observatório Ambiental</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<style>
/* Leve e arejado: uma coluna central, busca como ação principal, lista que filtra na hora, página da lei em três passos. */
:root{
  --green:#2FA765; --green-dk:#23864F; --green-50:#EAF7EF; --green-100:#D3EFDD;
  --bg:#FBFCFB; --white:#FFFFFF; --ink:#16201A; --gray:#66726B; --soft:#9AA59F; --line:#E6ECE8;
  --sun:#FFF6CF; --sun-ink:#7A5B00; --lime:#EDF5A8; --lime-ink:#4F5A00; --rose:#FDE7E7; --rose-ink:#B23B3B; --sky:#E5F0FF; --sky-ink:#2C5AA0; --cream:#FFFDF4;
  --font:"Figtree",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em;line-height:1.15}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:3px;border-radius:6px}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px}

/* cabeçalho */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent}
.head.scrolled{border-bottom-color:var(--line)}
.head .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px}
.brand{font-weight:800;font-size:1.05rem;display:flex;align-items:center;gap:8px}
.brand i{width:12px;height:12px;border-radius:50% 50% 50% 0;background:var(--green);transform:rotate(-45deg)}
.pill-btn{background:var(--green);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-weight:600;font-size:.9rem;transition:background .15s,transform .15s}
.pill-btn:hover{background:var(--green-dk);transform:translateY(-1px)}
.pill-btn.done{background:var(--green-50);color:var(--green-dk)}

/* hero */
.hero{padding-block:56px 28px;display:grid;gap:22px;text-align:center}
.hero h1{font-size:clamp(2rem,5.4vw,3rem);font-weight:800}
.hero h1 em{font-style:normal;color:var(--green)}
.hero p{color:var(--gray);max-width:46ch;margin:0 auto}
.search{display:flex;align-items:center;gap:6px;background:var(--white);border:1.5px solid var(--line);border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 6px 24px -12px rgba(22,32,26,.18);transition:border-color .15s}
.search:focus-within{border-color:var(--green)}
.search svg{flex:none;color:var(--soft)}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font:inherit;padding:8px 4px;color:var(--ink)}
.search input::placeholder{color:var(--soft)}

/* chips de filtro */
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.chip{border:1px solid var(--line);background:var(--white);border-radius:999px;padding:6px 14px;font-size:.88rem;font-weight:500;color:var(--gray);transition:all .15s}
.chip:hover{border-color:var(--green);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}

/* tópicos */
.section{padding-block:28px;display:grid;gap:16px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.section-h h2{font-size:1.35rem;font-weight:700}
.section-h span{color:var(--soft);font-size:.88rem}
.topics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.topic{background:var(--green-50);border-radius:18px;padding:16px 14px;display:grid;gap:10px;align-content:start;transition:transform .2s,background .2s;border:0;text-align:left}
.topic:hover{transform:translateY(-4px);background:var(--green-100)}
.topic[aria-pressed="true"]{background:var(--green);color:#fff}
.topic[aria-pressed="true"] small{color:#E4F6EB}
.topic svg{width:26px;height:26px;color:var(--green-dk)}
.topic[aria-pressed="true"] svg{color:#fff}
.topic b{font-weight:700;font-size:.98rem;line-height:1.2}
.topic small{color:var(--gray);font-size:.8rem}

/* lista */
.list{display:grid;gap:12px}
.law{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:8px;transition:transform .2s,box-shadow .2s,border-color .2s;animation:rise .35s ease both}
.law:hover{transform:translateY(-2px);box-shadow:0 12px 30px -18px rgba(22,32,26,.35);border-color:var(--green-100)}
.law .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.law h3{font-size:1.18rem;font-weight:700}
.law p{color:var(--gray);font-size:.95rem}
.law .go{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:2px}
.law .num{color:var(--green-dk);font-size:.85rem;font-weight:600}
.arrow{font-weight:600;font-size:.9rem;color:var(--ink);display:inline-flex;gap:6px;align-items:center}
.law:hover .arrow{color:var(--green-dk)}
.empty{text-align:center;color:var(--soft);padding:24px}
@keyframes rise{from{opacity:.001;transform:translateY(8px)}to{opacity:1;transform:none}}

.tag{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;white-space:nowrap}
.tg-place{background:var(--sun);color:var(--sun-ink)}
.tg-tram{background:var(--lime);color:var(--lime-ink)}
.tg-apr{background:var(--sky);color:var(--sky-ink)}
.tg-alto{background:var(--sun);color:var(--sun-ink)}
.tg-mal{background:var(--rose);color:var(--rose-ink)}
.tg-ben{background:var(--green-50);color:var(--green-dk)}
.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

.cta{margin-block:20px 64px;background:var(--green);color:#fff;border-radius:24px;padding:28px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between}
.cta h2{font-size:1.35rem;font-weight:700}
.cta p{opacity:.9;font-size:.95rem}
.cta .pill-btn{background:#fff;color:var(--green-dk)}

/* página da lei */
.back{display:inline-flex;gap:6px;color:var(--gray);font-size:.9rem;margin-top:24px}
.back:hover{color:var(--ink)}
.lawhead{padding-block:18px 8px;display:grid;gap:12px}
.lawhead h1{font-size:clamp(1.7rem,4.5vw,2.4rem);font-weight:800}
.lawhead .num{color:var(--green-dk);font-weight:600;font-size:.92rem}
.steps{position:sticky;top:calc(env(safe-area-inset-top,0px) + 60px);z-index:4;display:flex;gap:6px;background:var(--bg);padding-block:10px;overflow-x:auto}
.steps a{flex:1;text-align:center;padding:9px 12px;border-radius:999px;font-size:.88rem;font-weight:600;color:var(--gray);background:var(--white);border:1px solid var(--line);white-space:nowrap;transition:all .15s}
.steps a.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.block{border-radius:22px;padding:clamp(20px,4vw,30px);display:grid;gap:14px;margin-top:14px;scroll-margin-top:130px}
.b-law{background:var(--cream);border:1px solid #F3ECCB}
.b-par{background:var(--green-50)}
.b-mat{background:var(--rose)}
.block h2{font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:10px}
.block h2 small{font-size:.8rem;font-weight:600;color:var(--soft)}
.lawtext{display:grid;gap:10px;color:#3A443E;font-size:.97rem}
.lawtext .ttl{font-weight:700;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink)}
.collapsible{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.collapsible.open{grid-template-rows:1fr}
.collapsible > div{overflow:hidden;display:grid;gap:10px}
.link-btn{justify-self:start;background:none;border:0;padding:0;font-weight:600;color:var(--ink);font-size:.92rem;border-bottom:2px solid var(--ink)}
.quick{display:grid;gap:10px;grid-template-columns:repeat(3,minmax(0,1fr))}
.quick div{background:var(--white);border-radius:14px;padding:14px;display:grid;gap:4px;align-content:start}
.quick b{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--green-dk)}
.quick span{font-size:.93rem}
.par{display:grid;gap:12px;color:#3A443E;max-width:64ch}
.unlock{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--gray);font-size:.92rem}
.files{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.file{display:flex;align-items:center;gap:14px;background:var(--white);border:0;border-radius:16px;padding:14px 16px;text-align:left;transition:transform .2s}
.file:hover{transform:translateY(-2px)}
.file .ic{width:38px;height:44px;border-radius:6px;background:var(--rose);color:var(--rose-ink);display:grid;place-items:center;font-size:.66rem;font-weight:800;flex:none}
.file b{display:block;font-size:.95rem}
.file span{font-size:.82rem;color:var(--gray)}
.file .st{margin-left:auto;font-size:.8rem;color:var(--gray);white-space:nowrap}
.b-who{background:var(--white);border:1px solid var(--line)}
.people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.person{display:flex;gap:12px;align-items:center;background:var(--bg);border-radius:14px;padding:12px 14px;min-width:0}
.av{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.85rem;flex:none;background:var(--green-100);color:var(--green-dk)}
.av.rel{background:var(--sky);color:var(--sky-ink)}
.person small{display:block;font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700}
.person b{display:block;font-size:.98rem}
.person span{font-size:.85rem;color:var(--gray)}
.sub-h{font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;color:var(--soft);font-weight:700}
.votes{display:grid;gap:8px}
.vbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--line)}
.vbar span{display:block;height:100%}
.vleg{display:flex;gap:14px;flex-wrap:wrap;font-size:.88rem;color:var(--gray)}
.vleg i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
.parties{display:grid;gap:6px}
.party{display:grid;grid-template-columns:minmax(0,1fr) 90px 70px;gap:10px;font-size:.88rem;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line)}
.party:last-child{border-bottom:0}
.party em{font-style:normal;font-size:.78rem;font-weight:600;padding:2px 8px;border-radius:999px;justify-self:start}
.o-sim{background:var(--green-50);color:var(--green-dk)} .o-nao{background:var(--rose);color:var(--rose-ink)} .o-lib{background:var(--line);color:var(--gray)}
.emendas{display:grid;gap:8px}
.emenda{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;align-items:start;font-size:.92rem}
.emenda .n{background:var(--sun);color:var(--sun-ink);font-weight:700;font-size:.75rem;border-radius:8px;padding:3px 8px}
.emenda span{color:var(--gray);font-size:.84rem;display:block}
.path{display:flex;gap:0;overflow-x:auto;padding-bottom:4px}
.path div{flex:1;min-width:92px;display:grid;gap:6px;justify-items:center;text-align:center;font-size:.78rem;color:var(--soft);position:relative}
.path div::before{content:"";position:absolute;top:7px;left:-50%;width:100%;height:2px;background:var(--line);z-index:0}
.path div:first-child::before{display:none}
.path i{width:16px;height:16px;border-radius:50%;background:var(--white);border:2px solid var(--line);position:relative;z-index:1}
.path .ok{color:var(--ink)} .path .ok i{background:var(--green);border-color:var(--green)} .path .ok::before{background:var(--green)}
.path .now{color:var(--ink);font-weight:700} .path .now i{background:var(--white);border-color:var(--green);box-shadow:0 0 0 4px var(--green-50)} .path .now::before{background:var(--green)}
.foot{color:var(--soft);font-size:.8rem;text-align:center;padding-block:40px}

/* inscrição */
.scrim{position:fixed;inset:0;background:rgba(22,32,26,.45);display:grid;place-items:center;padding:16px;z-index:20;animation:fade .2s ease}
.modal{background:var(--white);border-radius:22px;padding:26px;max-width:400px;width:100%;display:grid;gap:14px;animation:rise .25s ease}
.modal h2{font-size:1.4rem;font-weight:800}
.modal p{color:var(--gray);font-size:.92rem}
.modal input,.modal select{font:inherit;width:100%;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--white);color:var(--ink)}
.modal input:focus,.modal select:focus{outline:0;border-color:var(--green)}
.modal .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .chk{display:flex;gap:8px;align-items:flex-start;font-size:.85rem;color:var(--gray)}
.modal .chk input{width:auto;margin-top:3px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;align-items:center}
.ghost{background:none;border:0;color:var(--gray);padding:8px}
@keyframes fade{from{opacity:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:.9rem;z-index:30;animation:rise .25s ease}

@media (max-width:640px){
  .topics{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topics .topic:last-child{grid-column:1/-1}
  .quick,.files,.modal .row,.people{grid-template-columns:1fr}
  .party{grid-template-columns:minmax(0,1fr) 80px}
  .party .c{display:none}
  .hero{padding-block:36px 20px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

  <a class="brand" href="#home"><i></i>Nome do Site</a>

</div></header>
<main id="app"></main>
<p class="foot">Rascunho visual · conteúdos fictícios</p>
<div id="layer"></div>

<script>
const ICON = {
  timeline:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h10M4 12h16M4 18h7"/><circle cx="17" cy="6" r="2"/><circle cx="14" cy="18" r="2"/></svg>',
  estado:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 21s-6-5.6-6-11a6 6 0 1 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>',
  federal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 10h18M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18M12 3l9 5H3z"/></svg>',
  opiniao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M8 9h8M8 12h5" stroke-linecap="round"/></svg>',
  artigos:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 17l5-5 4 4 7-8"/><path d="M15 8h5v5"/></svg>',
};
const TOPICS = [["todos","timeline","Timeline","Tudo, em ordem"],["estadual","estado","Leis estaduais","Por estado"],["federal","federal","Leis federais","Câmara e Senado"],["parecer","opiniao","Opinião","Pareceres técnicos"],["artigos","artigos","Artigos","Tendências"]];
const LEIS = [
  {id:"resex",esfera:"estadual",local:"Pará",status:"Em tramitação",titulo:"Nova reserva extrativista no Baixo Rio Exemplo",num:"PL nº 123/2026",
   resumo:"Cria uma unidade de conservação de uso sustentável com 48 mil hectares para comunidades extrativistas.",imp:"Alto impacto",car:"Benéfico",parecer:true},
  {id:"lic",esfera:"federal",local:"Federal",status:"Em tramitação",titulo:"Licenciamento simplificado para fazendas de médio porte",num:"PL nº 1.234/2026",
   resumo:"Dispensa estudo de impacto ambiental e transfere a decisão aos municípios.",imp:"Alto impacto",car:"Maléfico",parecer:true},
  {id:"agua",esfera:"estadual",local:"Tocantins",status:"Aprovada",titulo:"Outorga coletiva de água para irrigação",num:"Lei nº 4.567/2026",
   resumo:"Permite que produtores de uma mesma bacia dividam uma única autorização de uso da água.",imp:"Alto impacto",car:"Maléfico",parecer:true},
  {id:"caat",esfera:"federal",local:"Federal",status:"Aprovada",titulo:"Programa nacional de restauração da Caatinga",num:"Lei nº 15.0XX/2026",
   resumo:"Define metas de recomposição da vegetação nativa até 2035, com recursos do fundo clima.",imp:"Alto impacto",car:"Benéfico",parecer:true},
  {id:"pant",esfera:"federal",local:"Federal",status:"Em tramitação",titulo:"Regras de proteção do Pantanal",num:"PL nº 140/2026",
   resumo:"Restringe a conversão de vegetação nativa e cria regras para o uso do fogo no bioma.",imp:"Alto impacto",car:"Benéfico",parecer:false},
];
const ATORES = {
  resex:{autor:["Dep. Est. Exemplo A","PART-PA"],relator:["Dep. Est. Exemplo B","PART-PA"],orgao:"Comissão de Meio Ambiente da ALEPA",data:"08/10/2026",sim:14,nao:5,abs:1,
    partidos:[["Bloco Exemplo 1","sim","9 × 0"],["Bloco Exemplo 2","nao","2 × 5"],["Bloco Exemplo 3","lib","3 × 0"]],
    emendas:[["1","Dep. Est. Exemplo C","Reduz a área da reserva para 40 mil hectares"],["2","Dep. Est. Exemplo D","Fixa prazo de 2 anos para o plano de manejo"],["3","Dep. Est. Exemplo E","Garante assento das comunidades no conselho"]],
    etapas:["Apresentado","Comissão","Plenário","Sanção"],atual:2},
  lic:{autor:["Dep. Exemplo F","PART-MT"],relator:["Dep. Exemplo G","PART-GO"],orgao:"Comissão de Meio Ambiente da Câmara",data:"08/10/2026",sim:12,nao:7,abs:1,
    partidos:[["Bloco Exemplo 1","sim","8 × 0"],["Bloco Exemplo 2","nao","1 × 6"],["Bloco Exemplo 3","lib","3 × 1"]],
    emendas:[["3","Dep. Exemplo H","Exclui a Amazônia Legal do procedimento simplificado"],["7","Dep. Exemplo I","Eleva o limite para 5.000 hectares"]],
    etapas:["Apresentado","Comissões","Plenário Câmara","Senado","Sanção"],atual:2},
  agua:{autor:["Dep. Est. Exemplo J","PART-TO"],relator:["Dep. Est. Exemplo K","PART-TO"],orgao:"Plenário da ALETO",data:"15/09/2026",sim:18,nao:4,abs:2,
    partidos:[["Bloco Exemplo 1","sim","12 × 0"],["Bloco Exemplo 2","nao","2 × 4"],["Bloco Exemplo 3","sim","4 × 0"]],
    emendas:[["1","Dep. Est. Exemplo L","Exige monitoramento da vazão pela agência estadual"]],
    etapas:["Apresentado","Comissão","Plenário","Sanção"],atual:4},
  caat:{autor:["Sen. Exemplo M","PART-PE"],relator:["Dep. Exemplo N","PART-CE"],orgao:"Plenário da Câmara",data:"10/09/2026",sim:398,nao:41,abs:6,
    partidos:[["Bloco Exemplo 1","sim","210 × 2"],["Bloco Exemplo 2","sim","150 × 9"],["Bloco Exemplo 3","nao","38 × 30"]],
    emendas:[["2","Dep. Exemplo O","Inclui o semiárido mineiro no programa"]],
    etapas:["Senado","Câmara","Sanção"],atual:3},
  pant:{autor:["Sen. Exemplo P","PART-MS"],relator:["Sen. Exemplo Q","PART-MT"],orgao:null,
    emendas:[["1","Sen. Exemplo R","Permite queima controlada em áreas de manejo tradicional"]],
    etapas:["Apresentado","Comissões","Plenário Senado","Câmara","Sanção"],atual:1},
};
const ini = n => n.replace(/^(Dep\. Est\.|Dep\.|Sen\.)\s*/,"").split(" ").map(w=>w[0]).slice(0,2).join("");
function quem(l){
  const a=ATORES[l.id]; const tot=a.orgao?a.sim+a.nao+a.abs:0; const pc=v=>(v/tot*100).toFixed(1)+"%";
  return `<section class="block b-who" id="s-who">
    <h2>Quem está por trás</h2>
    <div class="people">
      <div class="person"><span class="av">${ini(a.autor[0])}</span><div><small>Autor</small><b>${a.autor[0]}</b><span>${a.autor[1]}</span></div></div>
      <div class="person"><span class="av rel">${ini(a.relator[0])}</span><div><small>Relator</small><b>${a.relator[0]}</b><span>${a.relator[1]}</span></div></div>
    </div>
    <div class="votes"><span class="sub-h">Última votação${a.orgao?` · ${a.orgao} · ${a.data}`:""}</span>
      ${a.orgao?`<div class="vbar" role="img" aria-label="${a.sim} sim, ${a.nao} não, ${a.abs} abstenções"><span style="width:${pc(a.sim)};background:var(--green)"></span><span style="width:${pc(a.nao)};background:var(--rose-ink)"></span><span style="width:${pc(a.abs)};background:var(--soft)"></span></div>
      <div class="vleg"><span><i style="background:var(--green)"></i><b>${a.sim}</b> sim</span><span><i style="background:var(--rose-ink)"></i><b>${a.nao}</b> não</span><span><i style="background:var(--soft)"></i><b>${a.abs}</b> abstenção</span></div>
      <div class="collapsible" id="part"><div><div class="parties">${a.partidos.map(p=>`<div class="party"><span>${p[0]}</span><em class="o-${p[1]}">Orientou ${p[1]==="sim"?"sim":p[1]==="nao"?"não":"liberado"}</em><span class="c" style="color:var(--gray)">${p[2]}</span></div>`).join("")}</div></div></div>
      <button class="link-btn" data-act="part">Ver votos por partido</button>`:`<p style="color:var(--gray);font-size:.92rem">Ainda não foi votado.</p>`}
    </div>
    <div class="emendas"><span class="sub-h">Emendas (${a.emendas.length})</span>
      ${a.emendas.map(e=>`<div class="emenda"><span class="n">${e[0]}</span><div>${e[2]}<span>${e[1]}</span></div></div>`).join("")}
    </div>
    <div style="display:grid;gap:10px"><span class="sub-h">Caminho da lei</span>
      <div class="path">${a.etapas.map((e,i)=>`<div class="${i<a.atual?"ok":i===a.atual?"now":""}"><i></i>${e}</div>`).join("")}</div>
    </div>
  </section>`;
}
const state = {inscrito:false, topic:"todos", status:"Todas", q:"", leiAberta:false};

const $ = s => document.querySelector(s);
const go = r => { location.hash = r; };
function toast(m){ const t=document.createElement("div"); t.className="toast"; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2400); }
const stTag = s => `<span class="tag dot ${s==="Aprovada"?"tg-apr":"tg-tram"}">${s}</span>`;
const carTag = c => `<span class="tag ${c==="Maléfico"?"tg-mal":"tg-ben"}">${c}</span>`;

function filtradas(){
  const q = state.q.trim().toLowerCase();
  return LEIS.filter(l =>
    (state.topic==="todos"||state.topic==="artigos"||(state.topic==="parecer"?l.parecer:l.esfera===state.topic)) &&
    (state.status==="Todas"||l.status===state.status) &&
    (!q || (l.titulo+l.resumo+l.local+l.num).toLowerCase().includes(q)));
}
function listHTML(){
  const ls = filtradas();
  if(!ls.length) return `<p class="empty">Nada encontrado com esses filtros. Tente outro termo ou estado.</p>`;
  return ls.map((l,i)=>`<a class="law" href="#${l.id}" style="animation-delay:${i*40}ms">
    <div class="top"><span class="tag tg-place">${l.local}</span>${stTag(l.status)}</div>
    <h3>${l.titulo}</h3><p>${l.resumo}</p>
    <div class="go"><span class="num">${l.num}</span><span class="arrow">${l.parecer?"Ler parecer":"Ver lei"} →</span></div></a>`).join("");
}
function home(){
  return `<div class="wrap">
    <section class="hero">
      <h1>Leis <em>ambientais</em> explicadas,<br>antes de virarem <em>realidade.</em></h1>
      <p>Acompanhe o que está em votação no seu estado e no Congresso, com parecer técnico em linguagem clara.</p>
      <form class="search" id="sf" role="search">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="text" placeholder="Busque uma lei, tema ou estado" value="${state.q}" aria-label="Buscar" autocomplete="off">
        <button class="pill-btn">Pesquisar</button>
      </form>
      <div class="chips" role="group" aria-label="Status">${["Todas","Em tramitação","Aprovada"].map(s=>`<button class="chip" data-status="${s}" aria-pressed="${state.status===s}">${s==="Aprovada"?"Aprovadas":s}</button>`).join("")}</div>
    </section>
    <section class="section">
      <div class="section-h"><h2>Explore por tópico</h2></div>
      <div class="topics">${TOPICS.map(t=>`<button class="topic" data-topic="${t[0]}" aria-pressed="${state.topic===t[0]}">${ICON[t[1]]}<b>${t[2]}</b><small>${t[3]}</small></button>`).join("")}</div>
    </section>
    <section class="section">
      <div class="section-h"><h2>Mais recentes</h2><span id="count">${filtradas().length} leis</span></div>
      <div class="list" id="list">${listHTML()}</div>
    </section>
    ${state.inscrito?"":`<section class="cta"><div style="display:grid;gap:4px"><h2>Notas técnicas e quadros comparativos</h2><p>Grátis para inscritos, com aviso quando uma lei andar.</p></div><button class="pill-btn" data-act="inscrever">Se inscreva grátis</button></section>`}
  </div>`;
}
function lei(l){
  const ins = state.inscrito;
  return `<div class="wrap">
    <a class="back" href="#home">← Voltar</a>
    <header class="lawhead">
      <div class="top" style="display:flex;gap:6px;flex-wrap:wrap"><span class="tag tg-place">${l.local}</span>${stTag(l.status)}<span class="tag tg-alto">${l.imp}</span>${carTag(l.car)}</div>
      <h1>${l.titulo}</h1><span class="num">${l.num}</span>
    </header>
    <nav class="steps" aria-label="Seções"><a href="#${l.id}" data-jump="s-lei" class="on">A lei</a><a href="#${l.id}" data-jump="s-who">Quem</a><a href="#${l.id}" data-jump="s-par">Parecer</a><a href="#${l.id}" data-jump="s-mat">Material</a></nav>

    <section class="block b-law" id="s-lei">
      <h2>A lei <small>texto oficial</small></h2>
      <div class="lawtext">
        <p class="ttl">${l.num} · 22 de agosto de 2026</p>
        <p><b>Art. 1º</b> ${l.resumo}</p>
        <div class="collapsible ${state.leiAberta?"open":""}" id="mais"><div>
          <p>§ 1º São objetivos desta Lei:</p>
          <p>I - assegurar o uso sustentável dos recursos naturais;</p>
          <p>II - proteger os meios de vida das populações tradicionais;</p>
          <p>III - conservar a biodiversidade local.</p>
          <p><b>Art. 2º</b> Esta Lei entra em vigor na data de sua publicação.</p>
        </div></div>
        <button class="link-btn" data-act="lei">${state.leiAberta?"Mostrar menos":"Ler texto completo"}</button>
      </div>
    </section>

    ${quem(l)}

    <section class="block b-par" id="s-par">
      <h2>Parecer técnico</h2>
      <div class="quick">
        <div><b>O que muda</b><span>${l.resumo}</span></div>
        <div><b>Quem é afetado</b><span>Comunidades locais, produtores e órgãos ambientais.</span></div>
        <div><b>Próximo passo</b><span>${l.status==="Aprovada"?"Regulamentação pelo Executivo.":"Votação em plenário nas próximas semanas."}</span></div>
      </div>
      <div class="par">
        <p>O projeto acerta ao vincular o uso dos recursos a um plano de manejo, mas não define prazo para elaborá-lo. Sem prazo, as regras podem ficar anos no papel.</p>
        <p>O conselho previsto no art. 2º não tem composição mínima. Recomendamos garantir participação das comunidades e de instituições de pesquisa.</p>
        <p><b>Conclusão:</b> ${l.imp.toLowerCase()}, com efeito ${l.car.toLowerCase()} condicionado à regulamentação.</p>
      </div>
    </section>

    <section class="block b-mat" id="s-mat">
      <h2>Material completo</h2>
      <div class="files">
        <button class="file" data-act="pdf"><span class="ic">PDF</span><span><b>Nota Técnica</b><span>Direito Ambiental</span></span><span class="st">${ins?"Baixar":"🔒"}</span></button>
        <button class="file" data-act="pdf"><span class="ic">PDF</span><span><b>Quadro comparativo</b><span>Antes × depois</span></span><span class="st">${ins?"Baixar":"🔒"}</span></button>
      </div>
      ${ins?"":`<div class="unlock"><button class="pill-btn" data-act="inscrever">Liberar materiais</button><span>Grátis para inscritos.</span></div>`}
    </section>
  </div>`;
}
function modal(){
  return `<div class="scrim" data-act="fechar"><form class="modal" id="f" onclick="event.stopPropagation()">
    <h2>Se inscreva grátis</h2>
    <p>Libere as notas técnicas e os quadros comparativos em PDF.</p>
    <input id="n" type="text" placeholder="Seu nome" aria-label="Nome" required>
    <input id="e" type="email" placeholder="Seu e-mail" aria-label="E-mail" required>
    <div class="row">
      <select id="p" aria-label="Perfil"><option>Advogado(a)</option><option>Estudante</option><option>Servidor(a)</option><option>Empresa</option><option>ONG</option><option>Cidadão(ã)</option></select>
      <select id="s" aria-label="Estado">${"AC AL AM AP BA CE DF ES GO MA MG MS MT PA PB PE PI PR RJ RN RO RR RS SC SE SP TO".split(" ").map(u=>`<option ${u==="TO"?"selected":""}>${u}</option>`).join("")}</select>
    </div>
    <label class="chk"><input id="c" type="checkbox"> Concordo com a Política de Privacidade</label>
    <div class="acts"><button type="button" class="ghost" data-act="fechar">Agora não</button><button class="pill-btn">Inscrever</button></div>
  </form></div>`;
}
function abrirInscricao(){
  $("#layer").innerHTML = modal(); $("#n").focus();
  $("#f").onsubmit = e=>{ e.preventDefault();
    if(!$("#c").checked){ toast("Marque a concordância com a Política de Privacidade"); return; }
    $("#layer").innerHTML=""; state.inscrito=true; toast("Pronto! Materiais liberados"); render(true); };
}

function render(keepScroll){
  const r=(location.hash||"").slice(1); const l=LEIS.find(x=>x.id===r);
  const y=window.scrollY;
  $("#app").innerHTML = l ? lei(l) : home();
  const b=$("#sub-btn"); b.textContent = state.inscrito?"Inscrito ✓":"Se inscreva grátis"; b.classList.toggle("done",state.inscrito);
  window.scrollTo(0, keepScroll?y:0);
  const sf=$("#sf");
  if(sf){ sf.onsubmit=e=>{e.preventDefault();}; $("#q").oninput=e=>{ state.q=e.target.value; refreshList(); }; }
}
function refreshList(){ $("#list").innerHTML=listHTML(); $("#count").textContent=filtradas().length+" leis"; }
window.addEventListener("hashchange",()=>render());
window.addEventListener("scroll",()=>{
  $("#head").classList.toggle("scrolled",window.scrollY>4);
  const steps=document.querySelectorAll(".steps a"); if(!steps.length) return;
  let cur="s-lei"; ["s-lei","s-who","s-par","s-mat"].forEach(id=>{ const el=document.getElementById(id); if(el && el.getBoundingClientRect().top<180) cur=id; });
  steps.forEach(a=>a.classList.toggle("on",a.dataset.jump===cur));
},{passive:true});
document.addEventListener("click",ev=>{
  const tp=ev.target.closest("[data-topic]"); if(tp){ state.topic=tp.dataset.topic; document.querySelectorAll("[data-topic]").forEach(b=>b.setAttribute("aria-pressed",b===tp)); refreshList(); return; }
  const ch=ev.target.closest("[data-status]"); if(ch){ state.status=ch.dataset.status; document.querySelectorAll("[data-status]").forEach(b=>b.setAttribute("aria-pressed",b===ch)); refreshList(); return; }
  const j=ev.target.closest("[data-jump]"); if(j){ ev.preventDefault(); document.getElementById(j.dataset.jump).scrollIntoView({behavior:"smooth"}); return; }
  const a=ev.target.closest("[data-act]"); if(!a) return;
  const act=a.dataset.act;
  if(act==="inscrever" && !state.inscrito) abrirInscricao();
  if(act==="fechar" && (ev.target===a || a.tagName==="BUTTON")) $("#layer").innerHTML="";
  if(act==="lei"){ state.leiAberta=!state.leiAberta; $("#mais").classList.toggle("open",state.leiAberta); a.textContent=state.leiAberta?"Mostrar menos":"Ler texto completo"; }
  if(act==="part"){ const c=$("#part"); c.classList.toggle("open"); a.textContent=c.classList.contains("open")?"Esconder votos por partido":"Ver votos por partido"; }
  if(act==="pdf"){ state.inscrito ? toast("Download da Nota Técnica (simulação)") : abrirInscricao(); }
});
document.addEventListener("keydown",e=>{ if(e.key==="Escape") $("#layer").innerHTML=""; });
render();
</script>
