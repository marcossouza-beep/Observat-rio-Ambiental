# Grava respostas reais das APIs da Câmara e do Senado em web/tests/fixtures/coleta/,
# para os testes dos conectores rodarem sem rede e sobre dados de verdade.
# Roda só sob demanda (as amostras mudam de propósito, porque os testes dependem delas);
# o resultado vira um commit no mesmo ramo.
name: Gravar amostras das APIs

on:
  workflow_dispatch:
    inputs:
      fonte:
        description: 'camara, senado, vetos, pdf, dou, sapl (separadas por vírgula) ou vazio para todas'
        required: false
        default: ''
      servidor:
        description: 'github (padrão, fora do Brasil) ou brasil (executor próprio com o rótulo brasil)'
        required: false
        default: 'github'

permissions:
  contents: write

# O INLABS recusa dois logins ao mesmo tempo: Coleta, Teste das APIs e Gravar amostras do DOU fazem fila.
# Gravações que não usam o INLABS (ex.: só sapl) rodam fora dessa fila.
concurrency:
  group: ${{ (github.event.inputs.fonte == '' || contains(github.event.inputs.fonte, 'dou')) && 'inlabs' || format('amostras-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  gravar:
    runs-on: ${{ github.event.inputs.servidor == 'brasil' && fromJSON('["self-hosted","brasil"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Chamar as APIs e gravar
        env:
          INLABS_EMAIL: ${{ secrets.INLABS_EMAIL }}
          INLABS_SENHA: ${{ secrets.INLABS_SENHA }}
        run: pnpm amostras ${{ github.event.inputs.fonte }}
      - name: Salvar no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/coleta
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git commit -m "Amostras reais das APIs ($(date -u +%Y-%m-%d))"
          for i in 1 2 3; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
