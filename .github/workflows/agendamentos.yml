# Tarefas agendadas do site, chamadas por HTTP (o plano gratuito da Vercel só roda cron uma vez por dia).
# Precisa dos segredos SITE_URL e CRON_SECRET no repositório; sem eles, não faz nada.
name: Agendamentos

on:
  schedule:
    - cron: '7 * * * *' # verificação: a cada hora
    - cron: '*/15 * * * *' # pareceres agendados, comunicados e fila de e-mails: a cada 15 min
    - cron: '41 6 * * *' # limpeza: todo dia, 03:41 em Brasília
  workflow_dispatch:
    inputs:
      tarefa:
        description: 'verificacao, quinze-minutos, publicar-agendados, comunicados, enviar-fila ou limpeza'
        required: true
        default: verificacao

jobs:
  tarefa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Escolher a tarefa
        id: t
        run: |
          case "${{ github.event.schedule }}" in
            '7 * * * *') echo "nome=verificacao" >> "$GITHUB_OUTPUT" ;;
            '*/15 * * * *') echo "nome=quinze-minutos" >> "$GITHUB_OUTPUT" ;;
            '41 6 * * *') echo "nome=limpeza" >> "$GITHUB_OUTPUT" ;;
            *) echo "nome=${{ github.event.inputs.tarefa }}" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Chamar o site
        if: env.SITE_URL != '' && env.CRON_SECRET != ''
        run: |
          curl -fsS --retry 3 --retry-delay 10 -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$SITE_URL/api/cron/${{ steps.t.outputs.nome }}" | tee resposta.json
          echo
          grep -q '"ok":true' resposta.json
      - name: Site ainda não configurado
        if: env.SITE_URL == '' || env.CRON_SECRET == ''
        run: echo "Defina os segredos SITE_URL e CRON_SECRET para ativar os agendamentos."
